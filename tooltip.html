<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="container mt-5">

    <div class="col-md-6 mt-3">
        <label for="classificacao" class="mb-2">Classificação
            <i class="bi bi-question-circle ms-2 text-danger" id="questaoClassificacao" data-bs-trigger="hover focus"
                data-bs-container="body" data-bs-toggle="popover" data-bs-placement="top" data-bs-title="Informação">
            </i>
            <span class="text-danger">*</span>
        </label>
        <select class="form-select" id="classificacao" name="classificacao" required disabled>
        </select>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script>
        const tooltipClassificacao = document.querySelector("#questaoClassificacao");
        const popover = new bootstrap.Popover(tooltipClassificacao, {
            html: true,
            content: `
                    <div class="popover-content">
                        <ul class="list-unstyled mb-0">
                            <li class="mb-2">
                                <span class="badge bg-success">Menor</span>
                                <small class="ms-2">Sem percepção do consumidor</small>
                            </li>
                            <li class="mb-2">
                                <span class="badge bg-warning text-dark">Maior</span>
                                <small class="ms-2">Impactos ao consumidor</small>
                            </li>
                            <li>
                                <span class="badge bg-danger">Crítica</span>
                                <small class="ms-2">Segurança</small>
                            </li>
                        </ul>
                    </div>
                `
        });
    </script>

<script>
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
  const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
    var lista_pecas;
    var lista_efeitos;
    var lista_falhas;
    function onSuccessPecas(lista) {
      lista_pecas = lista;
    }
    function onSuccessFalhas(lista) {
        lista_falhas = lista;
    }
    function onSuccessEfeitos(lista) {
        lista_efeitos = lista;
    }
    google.script.run.withSuccessHandler(onSuccessPecas).retornaListaPecas();
    google.script.run.withSuccessHandler(onSuccessFalhas).retornaListaFalhas();
    google.script.run.withSuccessHandler(onSuccessEfeitos).retornaListaEfeitos();
    
    function preventFormSubmit(){
      var forms=document.querySelectorAll('form');
      for (var i=0;i<forms.length;i++){
        forms[i].addEventListener('submit',function(event){
          event.preventDefault();
        });
      }
    }
  window.addEventListener('load',preventFormSubmit);
  
  function handleFormSubmit(formObject){
    google.script.run.processForm(formObject);
    document.getElementById("myForm").reset();
    exibeCampos(0);
  }
  
  function exibeCampos(a){
    if(a == 0){
      document.getElementById("classificacao").disabled = true;
      document.getElementById("efeito").disabled = true;
      document.getElementById("observacao").disabled = true;
      document.getElementById("qtde").disabled = true;
      document.getElementById("modo_falha").disabled = true;
      document.getElementById("peca").disabled = true;
    }else{
      document.getElementById("classificacao").disabled = false;
      document.getElementById("efeito").disabled = false;
      document.getElementById("observacao").disabled = false;
      document.getElementById("qtde").disabled = false;
      document.getElementById("modo_falha").disabled = false;
      document.getElementById("peca").disabled = false;
    }
  }
  
  function atualizaPecas(plataforma){
    var pecasSelect = document.getElementById("peca");
        pecasSelect.options.length = 0;
        lista_pecas.forEach((peca) => {
          if(peca[1]==plataforma){
            option = new Option(peca[0], peca[0]);
            pecasSelect.options[pecasSelect.options.length] = option;
        }
    });
  }
  
  function atualizaFalhas(plataforma){
    var falhasSelect = document.getElementById("modo_falha");
        falhasSelect.options.length = 0;
        lista_falhas.forEach((falha) => {
          if(falha[1]==plataforma){
            option = new Option(falha[0], falha[0]);
            falhasSelect.options[falhasSelect.options.length] = option;
        }
    });
  }
  
  function atualizaEfeitos(plataforma){
    var efeitosSelect = document.getElementById("efeito");
        efeitosSelect.options.length = 0;
        lista_efeitos.forEach((efeito) => {
          if(efeito[1]==plataforma){
            option = new Option(efeito[0], efeito[0]);
            efeitosSelect.options[efeitosSelect.options.length] = option;
        }
    });
  }
  
   function mudaPlataforma(){
        var plataforma = document.getElementById("linha").value;
        plataforma = plataforma.substring(plataforma.indexOf('-')+1);
        atualizaPecas(plataforma);
        atualizaFalhas(plataforma);
        atualizaEfeitos(plataforma);
  }
  
  </script>
</body>

</html>
