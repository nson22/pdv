<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/gijgo@1.9.14/css/gijgo.min.css" rel="stylesheet" type="text/css" />

    <style>
        label,
        button,
        span,
        h1,
        h2,
        h3,
        h6,
        h5,
        h6 {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center my-4">
            <img src="https://cache2net4.com/Repositorio/13384/Logo/logo%20site2.png" alt="Logo" style="width: 14rem;"
                class="navbar-brand">
            <button class="btn btn-outline-secondary" onclick="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Sair
            </button>
        </div>
        <h5 class="text-uppercase text-center mb-4">Ordem de serviço</h5>
        <nav class="nav nav-pills  nav-justified">
            <button class="nav-link fw-semibold active" id="pills-open-tab" data-bs-toggle="pill"
                data-bs-target="#pills-open" type="button" role="tab" aria-controls="pills-open" aria-selected="true">Em
                aberto</button>
            <button class="nav-link fw-semibold" id="pills-progress-tab" data-bs-toggle="pill"
                data-bs-target="#pills-progress" type="button" role="tab" aria-controls="pills-progress"
                aria-selected="false">Em progresso</button>
        </nav>
        <div class="row" id="orders">
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <p class="mt-3" id="modalMessage"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-body">
                    <form id="setPersonInChargeForm" class="needs-validation" novalidate>
                        <div class="row justify-content-center mt-5 pt-5">
                            <div class="col-12 col-md-8 col-lg-6">
                                <div class="card shadow">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-center align-items-center my-4">
                                            <img src="https://cache2net4.com/Repositorio/13384/Logo/logo%20site2.png"
                                                alt="Logo" style="width: 16rem;" class="navbar-brand">
                                        </div>
                                        <form id="setPersonInChargeForm" class="needs-validation" novalidate>
                                            <div class="mb-3">
                                                <label for="personInCharge"
                                                    class="form-label text-uppercase fw-semibold">Matrícula</label>
                                                <input type="search" inputmode="numeric" class="form-control"
                                                    id="personInCharge" placeholder="Informe sua matrícula" required>
                                                <div class="invalid-feedback">
                                                    Por favor, informe sua matrícula.
                                                </div>
                                            </div>
                                            <div class="mb-4">
                                                <label for="personInChargeCode"
                                                    class="form-label text-uppercase fw-semibold">Código</label>
                                                <input type="password" inputmode="numeric" class="form-control"
                                                    id="personInChargeCode" autocomplete="off"
                                                    placeholder="Informe seu código único" required>
                                                <div class="invalid-feedback">
                                                    Por favor, informe seu código único.
                                                </div>
                                            </div>
                                            <div id="erroMessageModal" class="mb-3 text-danger"></div>
                                            <div class="d-grid gap-2" id="btnLogin">
                                                <button type="submit"
                                                    class="btn btn-outline-primary fw-semibold text-uppercase">Entrar</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="cancelMotiveModal" tabindex="-1" aria-labelledby="cancelMotiveModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cancelMotiveModalLabel">Motivo do Cancelamento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <textarea id="cancelMotiveText" class="form-control" rows="3" required
                        style="resize: none;"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary" id="confirmCancelButton">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notificationToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Notificação</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const url = 'https://script.google.com/macros/s/AKfycbxc-4K3nm3dNqo8RfpQUmL1Eew9heNSQ7vthVOsU1LNhVHDkKYBmlxU6tYqN3b9GoTuLw/exec'
        const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'));
        const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
        const cancelMotiveModal = new bootstrap.Modal(document.getElementById('cancelMotiveModal'));
        const containerId = document.querySelector('#orders')
        var personInChargeName = localStorage.getItem('personInChargeName') || null
        var currentOrderId;

        document.addEventListener('DOMContentLoaded', () => {

            if (!personInChargeName || personInChargeName === 'undefined') {
                loginModal.show();
                return
            }

            if (checkAndSetTimer()) {
                try {
                    fetchOrdersWithStatus('Aberto');
                } catch (error) {

                }
                return
            }
        });

        document.querySelectorAll('button[data-bs-toggle="pill"]').forEach(button => {
            button.addEventListener('shown.bs.tab', function (event) {
                const status = event.target.id === 'pills-open-tab' ? 'Aberto' : 'Em progresso';
                fetchOrdersWithStatus(status);
            });
        });

        document.getElementById('setPersonInChargeForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            event.stopPropagation();

            if (this.checkValidity()) {
                await login();
            }

            this.classList.add('was-validated');
        });

        /**
         * Realiza o processo de login do usuário.
         * 
         * Esta função é responsável por:
         * - Obter os valores de matrícula e código do usuário
         * - Enviar uma requisição de autenticação para o servidor
         * - Armazenar o nome do usuário no localStorage se a autenticação for bem-sucedida
         * - Fechar o modal de login e iniciar o temporizador de sessão
         * - Buscar as ordens de serviço com status 'Aberto' após o login bem-sucedido
         * - Lidar com erros de autenticação e exibir notificações apropriadas
         *
         * @async
         * @function
         * @name login
         * @throws {Error} Lança um erro se houver falha na comunicação com o servidor
         * 
         * @example
         * // Chamada da função login (geralmente acionada por um evento de submissão de formulário)
         * await login();
         */
        async function login() {
            const personInCharge = document.getElementById('personInCharge');
            const personInChargeCode = document.getElementById('personInChargeCode');
            const btnLogin = document.getElementById('btnLogin');
            const errorMessageElement = document.getElementById('erroMessageModal');

            try {
                setLoginFormState(true);

                const response = await fetch(`${url}?action=read&table=colaboradores&employerId=${personInCharge.value}&code=${personInChargeCode.value}`);
                const { data } = await response.json();

                if (data.length === 0) {
                    showNotification('Matrícula e/ou código inválidos. Verifique suas credenciais.', 'danger');
                    return;
                }

                localStorage.setItem('personInChargeName', data[0].name);
                loginModal.hide();

                if (checkAndSetTimer()) {
                    fetchOrdersWithStatus('Aberto');
                }
            } catch (error) {
                console.error('Error:', error);
            } finally {
                setLoginFormState(false);
            }
        }

        /**
         * Realiza o processo de login do usuário.
         * 
         * Esta função é responsável por:
         * - Obter os valores de matrícula e código do usuário
         * - Enviar uma requisição de autenticação para o servidor
         * - Armazenar o nome do usuário no localStorage se a autenticação for bem-sucedida
         * - Fechar o modal de login e iniciar o temporizador de sessão
         * - Buscar as ordens de serviço com status 'Aberto' após o login bem-sucedido
         * - Lidar com erros de autenticação e exibir notificações apropriadas
         *
         * @async
         * @function
         * @name login
         * @throws {Error} Lança um erro se houver falha na comunicação com o servidor
         * 
         * @example
         * // Chamada da função login (geralmente acionada por um evento de submissão de formulário)
         * await login();
         */
        function logout() {
            localStorage.removeItem('personInChargeName');
            localStorage.removeItem('defeitosLocalData')
            localStorage.removeItem('solucoesLocalData')
            resetLoginForm();
            loginModal.show();
        }

        /**
         * Verifica se há um usuário logado e configura um temporizador para expiração da sessão.
         * 
         * Esta função é responsável por:
         * - Verificar se existe um nome de usuário armazenado no localStorage
         * - Se existir, configurar um temporizador para expirar a sessão após 30 minutos
         * - Remover as informações do usuário e mostrar o modal de login quando o temporizador expirar
         *
         * @function
         * @name checkAndSetTimer
         * @returns {boolean} Retorna true se um temporizador foi configurado, false caso contrário
         * 
         * @example
         * // Verificar e configurar o temporizador de sessão
         * if (checkAndSetTimer()) {
         *     console.log('Temporizador de sessão configurado');
         * } else {
         *     console.log('Nenhum usuário logado');
         * }
         */
        function checkAndSetTimer() {
            var timeout = 18_000_00; // 30 minutos

            if (localStorage.getItem('personInChargeName')) {
                setTimeout(() => {
                    localStorage.removeItem('personInChargeName');
                    showNotification('Sua sessão expirou. Por favor, faça login novamente.', 'warning');
                    loginModal.show();
                    containerId.innerHTML = ''
                }, timeout);
                return true
            }

            return false;
        }

        /**
         * Define o estado do formulário de login com base no status de carregamento.
         * 
         * Esta função é responsável por:
         * - Habilitar ou desabilitar os campos de entrada e o botão de login
         * - Alterar a aparência do botão de login para indicar o estado de carregamento
         * - Limpar mensagens de erro quando o carregamento é concluído
         *
         * @function
         * @name setLoginFormState
         * @param {boolean} isLoading - Indica se o formulário está em estado de carregamento
         * 
         * @example
         * // Para definir o formulário como carregando
         * setLoginFormState(true);
         * 
         * // Para definir o formulário como pronto
         * setLoginFormState(false);
         */
        function setLoginFormState(isLoading) {
            const personInCharge = document.getElementById('personInCharge');
            const personInChargeCode = document.getElementById('personInChargeCode');
            const btnLogin = document.getElementById('btnLogin');
            const errorMessageElement = document.getElementById('erroMessageModal');

            [personInCharge, personInChargeCode, btnLogin].forEach(el => el.disabled = isLoading);

            btnLogin.innerHTML = isLoading
                ? `<div class="placeholder-glow"><span class="btn btn-primary disabled placeholder col-12"></span></div>`
                : `<button type="submit" class="btn btn-outline-primary fw-semibold text-uppercase">Entrar</button>`;

            if (!isLoading) {
                errorMessageElement.textContent = '';
            }
        }

        /**
         * Reinicia o formulário de login, limpando os campos e mensagens de erro.
         * 
         * Esta função é responsável por:
         * - Limpar os campos de entrada do formulário de login
         * - Remover qualquer mensagem de erro exibida
         * - Redefinir o estado do formulário para seu estado inicial não carregado
         *
         * @function
         * @name resetLoginForm
         * 
         * @example
         * // Para reiniciar o formulário de login
         * resetLoginForm();
         */
        function resetLoginForm() {
            const personInCharge = document.getElementById('personInCharge');
            const personInChargeCode = document.getElementById('personInChargeCode');
            const errorMessageElement = document.getElementById('erroMessageModal');

            personInCharge.value = '';
            personInChargeCode.value = '';
            errorMessageElement.textContent = '';
            setLoginFormState(false);
        }

        /**
         * Busca e renderiza as ordens de serviço com base no status especificado.
         * 
         * Esta função limpa o conteúdo atual do contêiner, exibe um modal de carregamento,
         * busca as ordens de serviço do servidor com o status especificado, renderiza as ordens
         * no contêiner e verifica os dados das datalists.
         *
         * @function
         * @name fetchOrdersWithStatus
         * @param {string} status - O status das ordens de serviço a serem buscadas ('Aberto' ou 'Em progresso').
         * 
         * @throws {Error} Lança um erro se a busca das ordens de serviço falhar.
         * 
         * @example
         * // Busca ordens de serviço com status 'Aberto'
         * fetchOrdersWithStatus('Aberto');
         */
        function fetchOrdersWithStatus(status) {
            showLoadingModal(`Carregando ordens de serviço...`);
            containerId.innerHTML = '';

            fetch(`${url}?action=read&table=os&status=${status}`)
                .then(response => response.json())
                .then(({ data }) => {
                    renderOrders(data, containerId);
                }).then(
                    checkDatalistData
                )
                .catch(error => {
                    console.error(`Erro ao buscar ordens de serviço ${status.toLowerCase()}`, error);
                })
                .finally(() => {
                    loadingModal.hide();
                });
        }

        /**
         * Obtém a visualização da aba atualmente ativa.
         * 
         * Esta função identifica qual aba está atualmente ativa na interface do usuário
         * e retorna um identificador correspondente.
         * 
         * @function
         * @name getCurrentTabView
         * @returns {string} O identificador da aba atual ('open' ou 'progress').
         * 
         * @example
         * // Obtém a visualização da aba atual
         * const currentView = getCurrentTabView();
         * console.log(currentView); // Pode retornar 'open' ou 'progress'
         */
        function getCurrentTabView() {
            const currentTab = document.querySelector('.active');
            return currentTab.id.split('-')[1];
        }

        /**
         * Verifica e carrega os dados para as datalists de defeitos e soluções.
         * 
         * Esta função é responsável por verificar qual aba está ativa (aberta ou em progresso)
         * e carregar os dados apropriados para a datalist correspondente. Ela primeiro tenta
         * recuperar os dados do localStorage. Se não encontrar, chama a função fetchDatalistData
         * para buscar os dados do servidor.
         * 
         * @function
         * @name checkDatalistData
         * 
         * @example
         * // Chamada da função
         * checkDatalistData();
         * 
         * // Esta chamada irá:
         * // 1. Verificar qual aba está ativa
         * // 2. Tentar carregar os dados do localStorage
         * // 3. Se não encontrar no localStorage, buscar os dados do servidor
         * // 4. Preencher a datalist apropriada com os dados obtidos
         */
        function checkDatalistData() {
            let currentTab = getCurrentTabView()

            if (currentTab === 'open') {
                const defectsLocalData = localStorage.getItem('defeitos')

                if (defectsLocalData) {
                    populateDatalist('defeitos', JSON.parse(defectsLocalData));
                    return;
                }

                fetchDatalistData('defeitos')
                return
            }

            if (currentTab === 'progress') {
                const solutionsLocalData = localStorage.getItem('solucoes')

                if (solutionsLocalData) {
                    populateDatalist('solucoes', JSON.parse(solutionsLocalData));
                    return;
                }

                fetchDatalistData('solucoes')
                return
            }
        }

        /**
         * Busca dados para preencher uma datalist específica.
         * @param {string} item - O nome do item para buscar dados (ex: 'defeitos', 'solucoes').
         */
        function fetchDatalistData(item) {
            fetch(`${url}?action=read&table=${item}`)
                .then(response => response.json())
                .then(({ data }) => {
                    localStorage.setItem(`${item}LocalData`, JSON.stringify(data));
                    populateDatalist(item, data);
                })
                .catch(error => {
                    console.error(`Erro ao buscar dados para ${item}:`, error);
                    return [];
                });

        }

        /**
         * Preenche as datalists com os dados fornecidos.
         * @param {string} id - O identificador base para as datalists (ex: 'defeitos', 'solucoes').
         * @param {Array} data - Array de objetos contendo os dados para preencher as datalists.
         */
        function populateDatalist(id, data) {
            const datalists = document.querySelectorAll(`[id*='lista-de-${id}']`)

            datalists.forEach(datalist => {
                datalist.innerHTML = '';

                data.forEach(item => {
                    if (item && item.name && item.id) {
                        const option = document.createElement('option');
                        option.value = `${item.id} - ${item.name}`;
                        datalist.appendChild(option);
                    } else {
                        console.warn(`Invalid ${listName} object:`, item);
                    }
                });
            });
        }

        /**
         * Lida com o envio do formulário de atualização de status da ordem de serviço.
         * 
         * @param {Event} event - O evento de submit do formulário.
         * @param {string} orderId - O ID da ordem de serviço.
         * @param {string} action - A ação a ser realizada ('Em progresso', 'Finalizado', 'Cancelar').
         * 
         */
        function handleFormSubmit(event, orderId, action) {
            event.preventDefault();

            const form = document.getElementById(`form-${orderId}`);

            if (action === 'Cancelar') {
                cancelMotiveModal.show();

                document.getElementById('confirmCancelButton').onclick = function () {
                    const cancelMotive = document.getElementById('cancelMotiveText').value;
                    if (cancelMotive.trim() === '') {
                        showNotification('Por favor, forneça um motivo para o cancelamento.', 'warning');
                        return;
                    }

                    const motiveInput = document.createElement('input');
                    motiveInput.type = 'hidden';
                    motiveInput.name = 'cancel_description';
                    motiveInput.value = cancelMotive;
                    form.appendChild(motiveInput);

                    cancelMotiveModal.hide();
                    submitForm(form, orderId, 'Cancelado');
                };
                return;
            }

            if (!form.checkValidity() && action !== 'Cancelar') {
                event.stopPropagation();
                form.classList.add('was-validated');
                return;
            }

            let newStatus;
            switch (action) {
                case 'Em progresso':
                    newStatus = 'Em progresso';
                    break;
                case 'Finalizado':
                    newStatus = 'Finalizado';
                    break;
                default:
                    console.error('Ação inválida');
                    return;
            }

            submitForm(form, orderId, newStatus);
        }
        
        /**
         * Submete o formulário de atualização de status da ordem de serviço.
         * 
         * Esta função é responsável por processar o envio do formulário de atualização
         * de status de uma ordem de serviço. Ela exibe um modal de carregamento,
         * prepara os dados do formulário, adiciona informações específicas com base
         * no novo status e envia a atualização para o servidor.
         *
         * @function
         * @name submitForm
         * @param {HTMLFormElement} form - O elemento do formulário a ser submetido.
         * @param {string} orderId - O ID da ordem de serviço sendo atualizada.
         * @param {string} newStatus - O novo status da ordem de serviço ('Em progresso', 'Finalizado', ou 'Cancelado').
         * 
         * @example
         * // Submete o formulário para atualizar o status de uma ordem de serviço
         * const form = document.getElementById('orderForm');
         * submitForm(form, '12345', 'Em progresso');
         */
        function submitForm(form, orderId, newStatus) {
            showLoadingModal(`Atualizando ordem de serviço ${orderId}`);

            const formData = new FormData(form);
            formData.append('status', newStatus);

            if (newStatus === 'Em progresso') {
                const [defectCode, defectDescription] = document.querySelector(`[id='defeito-${orderId}']`).value.split('-');
                formData.append('in_progress_date', new Date().toISOString());
                formData.append('defect_code', defectCode.trim());
                formData.append('defect_description', defectDescription.trim());
                formData.append('in_progress_person', localStorage.getItem('personInChargeName'));
            } else if (newStatus === 'Finalizado') {
                const [solutionCode, solutionDescription] = document.querySelector(`[id='solucoes-${orderId}']`).value.split('-');
                formData.append('done_date', new Date().toISOString());
                formData.append('solution_code', solutionCode.trim());
                formData.append('solution_description', solutionDescription.trim());
                formData.append('done_person', localStorage.getItem('personInChargeName'));
            } else if (newStatus === 'Cancelado') {
                formData.append('canceled_date', new Date().toISOString());
                formData.append('canceled_person', localStorage.getItem('personInChargeName'));
            }

            const formDataObject = {};
            for (let [key, value] of formData.entries()) {
                formDataObject[key] = value;
            }

            updateStatusOrder(orderId, formDataObject, newStatus);

            form.classList.remove('was-validated');
        }

        /**
         * Atualiza o status de uma ordem de serviço no servidor.
         * 
         * Esta função envia uma requisição para atualizar o status de uma ordem de serviço específica,
         * e em seguida atualiza a interface do usuário com as ordens de serviço atualizadas.
         *
         * @function
         * @name updateStatusOrder
         * @param {string} orderId - O ID da ordem de serviço a ser atualizada.
         * @param {Object} data - Os dados atualizados da ordem de serviço.
         * @param {string} newStatus - O novo status da ordem de serviço.
         * 
         * @throws {Error} Lança um erro se a atualização da ordem de serviço falhar.
         * 
         * @example
         * // Atualiza o status de uma ordem de serviço
         * updateStatusOrder('123', { status: 'Em progresso', in_progress_date: '2023-05-10T10:00:00Z' }, 'Em progresso');
         */
        function updateStatusOrder(orderId, data, newStatus) {
            fetch(`${url}?action=update&table=os&id=${orderId}&data=${JSON.stringify(data)}`)
                .then(response => response.json())
                .then(({ data }) => {
                    const currentTab = getCurrentTabView()
                    if (currentTab === 'open') {
                        fetchOrdersWithStatus('Aberto');
                    } else {
                        fetchOrdersWithStatus('Em progresso');
                    }
                })
                .catch(error => {
                    console.error(`Erro ao atualizar ordem de serviço ${orderId}:`, error);
                    showNotification(`Erro ao atualizar ordem de serviço ${orderId}. Por favor, tente novamente.`, 'danger');
                })
        }

        /**
         * Renderiza as ordens de serviço na interface do usuário.
         * 
         * Esta função é responsável por exibir as ordens de serviço no contêiner especificado.
         * Se não houver ordens, exibe uma mensagem de alerta. Caso contrário, gera o HTML
         * para cada ordem de serviço e o adiciona ao contêiner.
         *
         * @function
         * @name renderOrders
         * @param {Array} data - Um array de objetos representando as ordens de serviço.
         * @param {HTMLElement} container - O elemento HTML onde as ordens serão renderizadas.
         * 
         * @example
         * // Exemplo de uso:
         * const ordersData = [
         *   { id: 1, status: 'Aberto', created_at: '2023-05-01T10:00:00Z', owner: 'João', department: 'TI', equipment: 'Computador', description: 'Tela não liga' },
         *   { id: 2, status: 'Em progresso', created_at: '2023-05-02T11:00:00Z', owner: 'Maria', department: 'RH', equipment: 'Impressora', description: 'Papel atolado' }
         * ];
         * const containerElement = document.getElementById('ordersContainer');
         * renderOrders(ordersData, containerElement);
         */
        function renderOrders(data, container) {
            if (data.length === 0) {
                container.innerHTML = `<div class="alert alert-warning w-100 mt-5 mx-2" role="alert">Nenhuma OS encontrada.</div>`;
                return;
            }

            data.forEach(order => {
                container.innerHTML += `
                    <form id="form-${order.id}" class="needs-validation">
                        <div class="accordion" id="orderAccordion-${order.id}">
                            <div class="accordion-item mt-3">
                                <h2 class="accordion-header" id="heading-${order.id}">
                                    <button class="accordion-button collapsed d-flex justify-content-between align-items-center"
                                        type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${order.id}"
                                        aria-expanded="false" aria-controls="collapse-${order.id}">
                                        <div>
                                            <span class="card-title fw-semibold text-muted" id="order-number-${order.id}">OS ${order.id}</span>
                                        </div>
                                    </button>
                                </h2>
                                <div id="collapse-${order.id}" class="accordion-collapse collapse"
                                    aria-labelledby="heading-${order.id}" data-bs-parent="#orderAccordion-${order.id}">
                                    <div class="accordion-body">
                                        <ul class="list-group list-group-flush">
                                            <li class="list-group-item">
                                                <div>
                                                    <h6 class="card-subtitle mb-2 fw-semibold">Data da abertura</h6>
                                                    <span class="text-muted ms-1" id="open-data-${order.id}">${toLocateDate(order.created_at)}</span>
                                                </div>
                                            </li>
                                            ${order.in_progress_date ? `<li class="list-group-item">
                                                <div>
                                                    <h6 class="card-subtitle mb-2 fw-semibold">Atualizado em</h6>
                                                    ${order.in_progress_date ? `<span class="text-muted ms-1" id="in-progressdata-${order.id}">${toLocateDate(order.in_progress_date)}</span>` : ''}
                                                </div>
                                            </li>
                                            <li class="list-group-item">
                                                <div>
                                                    <h6 class="card-subtitle mb-2 fw-semibold">Em execução há</h6>
                                                    <span class="text-muted ms-1" id="diff-date-${order.id}">${calculateTimeDifference(order.created_at, order.in_progress_date)}</span>
                                                </div>
                                            </li>` : ``}
                                            <li class="list-group-item">
                                                <div>
                                                    <h6 class="card-subtitle mb-2 fw-semibold">Solicitante</h6>
                                                    <span class="text-muted" id="solicitante-${order.id}">${order.owner}</span>
                                                </div>
                                            </li>
                                            <li class="list-group-item">
                                                <div>
                                                    <h6 class="card-subtitle mb-2 fw-semibold">Setor</h6>
                                                    <span class="text-muted" id="departamento-${order.id}">${order.department}</span>
                                                </div>
                                            </li>
                                            <li class="list-group-item">
                                                <div>
                                                    <h6 class="card-subtitle mb-2 fw-semibold">Equipamento</h6>
                                                    <span class="text-muted" id="equipamento-${order.id}">${order.equipment}</span>
                                                </div>
                                            </li>
                                            <li class="list-group-item">
                                                <div>
                                                    <h6 class="card-subtitle mb-2 fw-semibold">Descrição do problema</h6>
                                                    <span class="text-muted" id="descricao-${order.id}">${order.description}</span>
                                                </div>
                                            </li>
                                            <li class="list-group-item">
                                                ${order.status === 'Aberto' ? `<div>
                                                    <h6 class="card-subtitle mb-2 fw-semibold">Descrição do defeito</h6>
                                                    <input class="form-control" list="lista-de-defeitos-${order.id}" id="defeito-${order.id}" placeholder="Motivo da parada de máquina" required>
                                                    <div class="invalid-feedback">
                                                        Por favor, forneça a descrição do defeito.
                                                    </div>
                                                    <datalist id="lista-de-defeitos-${order.id}"></datalist>
                                                </div>`: `
                                                <div>
                                                    <h6 class="card-subtitle mb-2 fw-semibold">Descrição do defeito</h6>
                                                    <span class="text-muted" id="codigo-defeito-${order.id}">${order.defect_code} - ${order.defect_description}</span>
                                                </div>
                                                `}
                                            </li>
                                            ${order.status === 'Em progresso' ? `<li class="list-group-item">
                                                <div>
                                                    <h6 class="card-subtitle mb-2 fw-semibold">Solução da Parada</h6>
                                                        <input class="form-control" list="lista-de-solucoes-${order.id}" id="solucoes-${order.id}" placeholder="Descrição da solução da parada" required aria-label="Solução da Parada">
                                                    <div class="invalid-feedback">
                                                        Por favor, forneça uma solução para a parada.
                                                    </div>
                                                    <datalist id="lista-de-solucoes-${order.id}"></datalist>
                                                </div>
                                            </li>` : ''}
                                            <li class="list-group-item mt-4">
                                                <div class="d-flex justify-content-between">
                                                    ${order.status === 'Aberto'
                        ? `<button type="button" class="btn btn btn-danger fw-semibold w-50 me-1" onclick="handleFormSubmit(event, '${order.id}', 'Cancelar')">Cancelar</button>
                                                        <button type="button" class="btn btn btn-primary fw-semibold w-50 me-1" onclick="handleFormSubmit(event, '${order.id}', 'Em progresso')">Em progresso</button>`
                        : `<button type="button" class="btn btn-success fw-semibold w-100 me-1" onclick="handleFormSubmit(event, '${order.id}', 'Finalizado')">Finalizar</button>`
                    }
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                `;
            });
        }

        /**
         * Exibe um modal de carregamento com uma mensagem personalizada.
         * 
         * @param {string} message - A mensagem a ser exibida no modal de carregamento.
         */
        function showLoadingModal(message) {
            document.getElementById('modalMessage').textContent = message;
            loadingModal.show();
        }

        /**
         * Converte uma data para o formato local brasileiro.
         * 
         * @param {string|Date} date - A data a ser formatada.
         * @returns {string} A data formatada no padrão brasileiro (dd/mm/yyyy às hh:mm).
         */
        function toLocateDate(date) {
            const options = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            return new Date(date).toLocaleDateString('pt-BR', options).replace(',', ' às');
        }

        /**
         * Calcula a diferença de tempo entre duas datas.
         * 
         * @param {string|Date} startDate - A data de início.
         * @param {string|Date} endDate - A data de término.
         * @returns {string} A diferença de tempo formatada como "HH:MM:SS hrs".
         */
        function calculateTimeDifference(startDate, endDate) {
            const start = new Date(startDate);
            const end = new Date(endDate);
            const diffInMilliseconds = Math.abs(end - start);

            const hours = Math.floor(diffInMilliseconds / (1000 * 60 * 60));
            const minutes = Math.floor((diffInMilliseconds % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diffInMilliseconds % (1000 * 60)) / 1000);

            const formattedHours = hours.toString().padStart(2, '0');
            const formattedMinutes = minutes.toString().padStart(2, '0');
            const formattedSeconds = seconds.toString().padStart(2, '0');

            return `${formattedHours}:${formattedMinutes}:${formattedSeconds} hrs`;
        }

        /**
         * Exibe uma notificação toast com uma mensagem e tipo específicos.
         * 
         * @param {string} message - A mensagem a ser exibida na notificação.
         * @param {string} type - O tipo de notificação (ex: 'success', 'danger', 'warning').
         */
        function showNotification(message, type) {
            const toast = document.getElementById('notificationToast');
            const toastHeader = toast.querySelector('.toast-header');
            const toastMessage = document.getElementById('toastMessage');

            toastHeader.classList.remove('bg-success', 'bg-danger', 'bg-waring', 'text-white');
            toastHeader.classList.add(`bg-${type}`, 'text-white');

            toastMessage.innerHTML = message;

            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
        }
    </script>
