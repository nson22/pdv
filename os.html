<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/gijgo@1.9.14/css/gijgo.min.css" rel="stylesheet" type="text/css" />

    <style>
        label,
        button,
        span,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="d-flex justify-content-center w-100 mb-3 mt-3">
            <img src="https://cache2net4.com/Repositorio/13384/Logo/logo%20site2.png" alt="Logo" style="width: 12rem;"
                class="navbar-brand">
        </div>
        <h5 class="text-uppercase text-center fw-bold mb-3">Ordem de serviços</h5>
        <ul class="nav nav-pills nav-justified" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-semibold active" id="pills-open-tab" data-bs-toggle="pill"
                    data-bs-target="#pills-open" type="button" role="tab" aria-controls="pills-open"
                    aria-selected="true">Em aberto</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-semibold" id="pills-progress-tab" data-bs-toggle="pill"
                    data-bs-target="#pills-progress" type="button" role="tab" aria-controls="pills-progress"
                    aria-selected="false">Em progresso</button>
            </li>
        </ul>
        <div class="row mt-3" id="orders">
        </div>
    </div>
    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <p class="mt-3" id="loadingMessage"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="messageModalLabel">Mensagem</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="messageModalBody"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            showLoadingModal('Carregando dados, aguarde...');

            if (isLocalhost()) {
                setTimeout(() => {
                    renderOrders(mockData());
                    hideLoadingModal();
                }, 3000);

            } else {
                const tables = ['defeitos', 'solucao']

                const promises = tables.map(table =>
                    new Promise((resolve, reject) => {
                        google.script.run
                            .withSuccessHandler(response => {
                                populateSelect(table, response);
                                resolve();
                            })
                            .withFailureHandler(error => {
                                console.error(`Erro ao carregar ${table}:`, error);
                                reject(error);
                            })
                            .read(table);
                    })
                );

                Promise.all(promises)
                    .then(() => {
                        hideLoadingModal();
                    })
                    .catch(error => {
                        console.error('Erro ao carregar dados:', error);
                        hideLoadingModal();
                        showMessageModal('Erro ao carregar dados. Por favor, tente novamente.', 'Erro', false);
                    });
            }
        })

        /**
         * Exibe o modal de carregamento com uma mensagem personalizada.
         * 
         * @param {string} message - A mensagem a ser exibida no modal de carregamento.
         */
        function showLoadingModal(message) {
            const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'));
            document.getElementById('loadingMessage').textContent = message;
            loadingModal.show();
        }

        /**
         * Verifica se a aplicação está sendo executada em um ambiente local.
         * 
         * @function
         * @name isLocalhost
         * 
         * @description
         * Esta função checa se o hostname atual é "localhost" ou "127.0.0.1",
         * indicando que a aplicação está sendo executada em um ambiente de desenvolvimento local.
         * 
         * @returns {boolean} Retorna true se a aplicação estiver rodando localmente, false caso contrário.
         * 
         * @example
         * if (isLocalhost()) {
         *   console.log("Executando em ambiente local");
         * } else {
         *   console.log("Executando em ambiente de produção");
         * }
         */
        function isLocalhost() {
            return window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
        }

        /**
        * Oculta o modal de carregamento.
        */
        function hideLoadingModal() {
            const loadingModalElement = document.getElementById('loadingModal');
            const loadingModal = bootstrap.Modal.getInstance(loadingModalElement);
            if (loadingModal) {
                loadingModal.hide();
            }
        }

        function renderOrders(data) {
            const container = document.querySelector('#orders')
            
            
            if(data.length === 0){
                container.innerHTML = '<div class="alert alert-warning mx-2" role="alert">Nenhum chamado encontrado.</div>';
                return;
            }

            data.forEach(order => {
                container.innerHTML += `
                    <div class="accordion accordion-flush" id="orderAccordion">
                        <div class="accordion-item mx-2 mt-3">
                            <h2 class="accordion-header" id="flush-heading${order.id}">
                                <button class="accordion-button collapsed d-flex justify-content-between align-items-center"
                                    type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapse${order.id}">
                                    <div>
                                        <span class="card-title fw-bold">OS</span>
                                        <span class="card-title fw-semibold text-muted" id="order-number-${order.id}">${String(order.id).padStart(9, 0)}</span>
                                    </div>
                                </button>
                            </h2>
                            <div id="flush-collapse${order.id}" class="accordion-collapse collapse"
                                aria-labelledby="flush-heading${order.id}" data-bs-parent="#orderAccordion">
                                <div class="accordion-body">
                                    <ul class="list-group list-group-flush">
                                        <li class="list-group-item">
                                            <div>
                                                <h6 class="card-subtitle mb-2 fw-semibold">Data</h6>
                                                <span class="text-muted ms-1" id="data-${order.id}">${toLocateDate(order.createdAt)}</span>
                                            </div>
                                        </li>
                                        <li class="list-group-item">
                                            <div>
                                                <h6 class="card-subtitle mb-2 fw-semibold">Solicitante</h6>
                                                <span class="text-muted" id="solicitante-${order.id}">${order.requester}</span>
                                            </div>
                                        </li>
                                        <li class="list-group-item">
                                            <div>
                                                <h6 class="card-subtitle mb-2 fw-semibold">Setor</h6>
                                                <span class="text-muted" id="departamento-${order.id}">${order.department}</span>
                                            </div>
                                        </li>
                                        <li class="list-group-item">
                                            <div>
                                                <h6 class="card-subtitle mb-2 fw-semibold">Equipamento</h6>
                                                <span class="text-muted" id="equipamento-${order.id}">${order.equipment}</span>
                                            </div>
                                        </li>
                                        <li class="list-group-item">
                                            <div>
                                                <h6 class="card-subtitle mb-2 fw-semibold">Descrição</h6>
                                                <span class="text-muted" id="descricao-${order.id}">${order.description}</span>
                                            </div>
                                        </li>
                                        <li class="list-group-item">
                                            <div>
                                                <h6 class="card-subtitle mb-2 fw-semibold">Descrição do Defeito / Motivo da Parada de Máquina</h6>
                                                <input class="form-control" list="defectList" id="defect" placeholder="Filtrar defeitos">
                                                <datalist id="defectList">
                                                    <option value="Alarme de emergência">M01</option>
                                                    <option value="Alarme de erro de sistema do robô">M02</option>
                                                    <option value="Alarme no inversor">M03</option>
                                                </datalist>
                                            </div>
                                        </li>
                                        <li class="list-group-item">
                                            <div>
                                                <h6 class="card-subtitle mb-2 fw-semibold">Comentário</h6>
                                                <textarea type="search" rows=4 class="form-control" placeholder="Adicionar comentário" id="comentario-${order.id}" style="resize: none"></textarea>
                                            </div>
                                        </li>
                                        <li class="list-group-item">
                                            <div class="d-flex justify-content-between">
                                                <button type="button" class="btn btn-danger fw-semibold w-50 me-1" onclick="cancelOrder(${order.id})">Cancelar</button>
                                                <button type="button" class="btn btn-primary fw-semibold w-50 me-1" onclick="updateOrderStatus(${order.id})">Em progresso</button>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function toLocateDate(date) {
            const options = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            return new Date(date).toLocaleDateString('pt-BR', options).replace(',', ' às');
        }

        function mockData() {
            return Array.from({ length: 0 }, (_, i) => {
                return {
                    id: i + 1,
                    createdAt: new Date(),
                    requester: 'Nilson Silva',
                    department: 'TI',
                    equipment: 'Servidor',
                    description: "Servidor caiu",
                    status: 'Aberto',
                }
            })
        }
    </script>
</body>

</html>
