        const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'));

        document.addEventListener('DOMContentLoaded', () => {

            fetchOrdersWithStatus('Aberto');

            document.getElementById('pills-open-tab').addEventListener('click', () => {
                fetchOrdersWithStatus('Aberto');
            });

            document.getElementById('pills-progress-tab').addEventListener('click', () => {
                fetchOrdersWithStatus('Em progresso');
            });

        });

        function fetchOrdersWithStatus(status) {
            const containerId = document.querySelector('#orders')
            containerId.innerHTML = '';

            showLoadingModal(`Carregando ordens de serviço ${status.toLowerCase()}...`);

            fetch(`${url}?action=read&table=os&status=${status}`)
                .then(response => response.json())
                .then(({ data }) => {
                    renderOrders(data, containerId);
                })
                .catch(error => {
                    console.error(`Erro ao buscar ordens de serviço ${status.toLowerCase()}:`, error);
                    showMessageModal(`Erro ao carregar ordens de serviço ${status.toLowerCase()}. Por favor, tente novamente.`, 'Erro', false);
                })
                .finally(() => {
                    fetchDatalistData();
                    loadingModal.hide()
                });
        }

        function fetchDatalistData() {
            const datalists = ['defeitos', 'solucoes'];
            let needsFetch = false;

            datalists.forEach(item => {
                if (!localStorage.getItem(item)) {
                    needsFetch = true;
                }
            });

            if (needsFetch) {
                Promise.all(datalists.map(item =>
                    fetch(`${url}?action=read&table=${item}`)
                        .then(response => response.json())
                        .then(({ data }) => {
                            localStorage.setItem(item, JSON.stringify(data));
                            return { item, data };
                        })
                ))
                    .then(results => {
                        results.forEach(({ item, data }) => {
                            populateDatalist(item, data);
                        });
                    })
                    .catch(error => {
                        console.error(`Erro ao buscar dados:`, error);
                    })
                    .finally(() => {
                        loadingModal.hide();
                    });
            } else {
                datalists.forEach(item => {
                    const savedData = JSON.parse(localStorage.getItem(item));
                    populateDatalist(item, savedData);
                });
            }
        }

                                            </div>
                                        </li>
                                        <li class="list-group-item">
                                            <div>
                                                <h6 class="card-subtitle mb-2 fw-semibold">Descrição do Defeito</h6>
                                                <input class="form-control" list="defeitosList" id="defect" placeholder="Motivo da Parada de Máquina">
                                                <datalist id="defeitosList">
                                                </datalist>
                                            </div>
                                        </li>
                                        ${order.status === 'Em progresso' ? `<li class="list-group-item">
                                            <div>
                                                <h6 class="card-subtitle mb-2 fw-semibold">Solução da Parada</h6>
                                                <input class="form-control" list="solucoesList" id="defect" placeholder="Descrição da Solução da Parada">
                                                <datalist id="solucoesList">
                                                </datalist>
                                            </div>
                                        </li>` : ''}
                                        <li class="list-group-item">
                                            <div>
                                                <h6 class="card-subtitle mb-2 fw-semibold">Comentário</h6>
                                                <textarea type="search" rows=4 class="form-control" placeholder="Adicionar comentário" id="comentario-${order.id}" style="resize: none"></textarea>
                                            </div>
                                        </li>
                                        <li class="list-group-item">
                                            <div class="d-flex justify-content-between">
                                                ${order.status === 'Aberto' ? `<button type="button" class="btn btn-danger fw-semibold w-50 me-1" onclick="cancelOrder(${order.id})">Cancelar</button>` : ''}
                                                ${order.status === 'Em progress' ? 
                                                `<button type="button" class="btn btn-danger fw-semibold w-50 me-1" onclick="cancelOrder(${order.id})">Finalizar</button>` : 
                                                `<button type="button" class="btn btn-primary fw-semibold w-50 me-1" onclick="cancelOrder(${order.id})">Em progresso</button>`}
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function populateDatalist(listName, data) {
            const datalist = document.getElementById(`${listName}List`);

            if (!datalist) {
                return;
            }

            datalist.innerHTML = ''; // Clear existing options

            if (!Array.isArray(data) || data.length === 0) {
                console.warn(`No ${listName} to populate`);
                return;
            }

            data.forEach(item => {
                if (item && item.name && item.id) {
                    const option = document.createElement('option');
                    option.value = item.name;
                    option.textContent = item.id;
                    datalist.appendChild(option);
                } else {
                    console.warn(`Invalid ${listName} object:`, item);
                }
            });
        }
