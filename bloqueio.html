<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <title>Registro de Inspeção de Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous">
        </script>
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
        integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
</head>

<body class="">
    <div class="container">
        <div class="text-center">
            <img class="d-block mx-auto mb-4"
                src="https://upload.wikimedia.org/wikipedia/commons/9/95/Whirlpool_Corporation_Logo_%28as_of_2017%29.svg"
                alt="" width="300">
            <h2>Engenharia da Qualidade | Manaus</h2>
        </div>
        <h4 class="text-center py-3">Formulário de Solicitação de Bloqueio e Desbloqueio de Produtos</h4>

        <form class="needs-validation" id="formulario" onsubmit="handleFormSubmit(this)">
            <div class="row mb-3">
                <div class="col-8">
                    <label for="status" class="col-1 col-form-label fw-semibold">Razão</label>
                    <div for="status" class="btn-group">
                        <input type="radio" onchange="toggleRequiredFields()" class="btn-check" name="status"
                            id="bloqueio" autocomplete="off" checked value="bloqueio" />
                        <label class="btn btn-outline-danger" for="bloqueio">Bloqueio</label>
                        <input type="radio" onchange="toggleRequiredFields()" class="btn-check" name="status"
                            id="desbloqueio" autocomplete="off" value="desbloqueio" />
                        <label class="btn btn-outline-success" for="desbloqueio">Desbloqueio</label>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-3">
                    <label for="planta" class="fw-semibold">Planta</label>
                    <select class="form-select" id="planta" name='planta' required data-liberar>
                        <option value="Selecionar" disabled selected>Selecionar</option>
                    </select>
                </div>

                <div class="col-3">
                    <label for="local" class="fw-semibold">Deposito</label>
                    <select class="form-select" id="local" name='local' required data-liberar>
                        <option value="Selecionar" disabled selected>Selecionar</option>
                    </select>
                </div>

                <div class="col-3">
                    <label for="solicitante" class="fw-semibold">Solicitante</label>
                    <select class="form-select" id="solicitante" name='solicitante' required>
                        <option> </option>
                        <option value="Selecionar" disabled selected>Selecionar</option>
                    </select>
                </div>

                <div class="col-3">
                    <label for="linha" class="fw-semibold">Linha</label>
                    <select class="form-select" id="linha" name="linha" required data-liberar>
                        <option value="Selecionar" disabled selected>Selecionar</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-3">
                    <label for="sku" class="fw-semibold">SKU do Produto</label>
                    <input type="text" class="form-control" id="sku" placeholder="" name="sku"
                        style="text-transform:uppercase;" pattern="(B|b|C|c)(L|l|B|b|C|c|M|m|P|p)([A-Z0-9]|[a-z0-9]){8}"
                        required data-liberar>
                </div>
                <div class="col-3">
                    <label for="tpBloqueio" class="fw-semibold">Tipo bloqueio</label>
                    <select class="form-select" id="tpBloqueio" name='tpBloqueio' required data-liberar>
                        <option value="Selecionar" disabled selected>Selecionar</option>

                    </select>
                </div>

                <div class="col-3">
                    <label for="indicador" class="fw-semibold">Indicador</label>
                    <select class="form-select" id="indicador" name='indicador' required data-liberar>
                        <option value="Selecionar" disabled selected>Selecionar</option>

                    </select>
                </div>

                <div class="col-3">
                    <label for="motivo" class="fw-semibold">Motivo</label>
                    <input type="text" class="form-control" id="motivo" placeholder="" name="motivo" required
                        data-liberar>
                </div>

            </div>

            <div class="row mb-3" id="campo_Tipo_Qtde_Posto">
                <div class="col-3">
                    <label for="qtde" class="fw-semibold">Quantidade</label>
                    <input type="number" class="form-control" id="qtde" placeholder="" name="qtde" min="0" required
                        data-liberar>
                </div>

                <div class="col-3">
                    <label for="idReg" class="fw-semibold">ID Registro</label>
                    <input type="search" list="lista_id" class="form-control" id="idReg" name="idReg" required>
                    <datalist id="lista_id">
                        <option value="Selecionar" disabled selected>Selecionar</option>

                    </datalist>
                </div>

                <div class="col-3">
                    <label for="dtBloq" class="fw-semibold">Data de Produção do SKU</label>
                    <input type="date" class="form-control" id="dtBloq" placeholder="" name="dtBloq" required
                        data-liberar>
                </div>
                <div class="col-3">
                    <label for="dtInic" class="fw-semibold">Data Inicial do Bloqueio</label>
                    <input type="date" class="form-control" id="dtInic" placeholder="" name="dtInic" required
                        data-liberar>
                </div>

            </div>

            <div class="row mb-3">
                <div class="col-3">
                    <label for="dtPrev" class="fw-semibold">Previsão de Desbloqueio</label>
                    <input type="date" class="form-control" id="dtPrev" placeholder="" name="dtPrev" required
                        data-liberar>
                </div>

                <div class="col-9">
                    <label for="observacao" class="fw-semibold">Observação</label>
                    <textarea type="text" rows="1" class="form-control" id="observacao" style="resize: none;"
                        name="observacao"></textarea>
                </div>

            </div>
            <div class="row mt-5">
                <button class="btn btn-primary btn-lg w-100" type="submit">Registrar</button>
            </div>
        </form>

        </form>

        <!-- Loading Modal -->
        <div class="modal fade" id="loadingModal" tabindex="-1" aria-labelledby="loadingModalLabel" aria-hidden="true"
            data-bs-backdrop="static" data-bs-keyboard="false">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2" id="modalMessage">Processando solicitação...</p>
                    </div>
                </div>
            </div>
        </div>

        <footer class="my-5 pt-5 text-muted text-center text-small">
            <label class="mb-1">&copy; <span id="year"></span> Whirlpool Corporation </label>
        </footer>
    </div>

    <script>
        const loadingModal = new bootstrap.Modal(document.querySelector('#loadingModal'));
        const modalMessage = document.querySelector("#modalMessage")

        document.addEventListener('DOMContentLoaded', () => {
            modalMessage.textContent = "Carregando dados, aguarde."
            loadingModal.show()

            document.querySelector("#year").textContent = new Date().getFullYear()
            const currentUrl = window.location.hostname;
            if (currentUrl === '127.0.0.1' || currentUrl === 'localhost') {
                let countdown = 0.5;
                const loadingInterval = setInterval(() => {
                    modalMessage.textContent = `Carregando dados, aguarde..`;
                    countdown--;
                    if (countdown < 0) {
                        clearInterval(loadingInterval);
                        populateFormData(getFormDataMock());
                        loadingModal.hide();
                    }
                }, 1000);
            } else {
                fetchDataFromServer()
            }
        })

        function fetchDataFromServer() {
            google.script.run.withSuccessHandler((data) => {
                populateFormData(data)
                loadingModal.hide()
            }).withFailureHandler((error) => { console.error(error) }).getFormData();
        }

        function populateFormData(data) {
            console.log(data)
            // Populate plantas
            populateSelect('planta', data.plantas);

            // Populate other fields
            populateSelect('local', data.locais);
            populateSelect('solicitante', data.solicitantes);
            populateSelect('linha', data.linhas);
            populateSelect('tpBloqueio', data.tiposBloqueio);
            populateSelect('indicador', data.indicadores);
            populateSelect('lista_id', data.ids);
        }

        function populateSelect(elementId, options) {
            const selectElement = document.getElementById(elementId);
            selectElement.innerHTML = ''; // Clear existing options
            const optionElement = document.createElement('option');
            optionElement.disabled = true;
            optionElement.textContent = "Selecionar";
            optionElement.selected = true;
            selectElement.appendChild(optionElement);

            options.forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.value = option;
                optionElement.textContent = option;
                selectElement.appendChild(optionElement);
            });
        }

        function getFormDataMock() {
            return {
                plantas: ['Manaus', 'Rio Claro'],
                locais: ['Depósito 1', 'Depósito 2', 'Depósito 3'],
                solicitantes: ['João', 'Maria', 'Pedro'],
                linhas: ['Linha 1', 'Linha 2', 'Linha 3'],
                tiposBloqueio: ['Tipo 1', 'Tipo 2', 'Tipo 3'],
                indicadores: ['Indicador 1', 'Indicador 2', 'Indicador 3'],
                ids: ['ID 1', 'ID 2', 'ID 3']
            };
        }

        function toggleRequiredFields() {
            const idRegStatus = document.getElementById("idReg");
            const status = document.querySelector('input[name="status"]:checked').value;
            const elements = document.querySelectorAll('[data-liberar]');

            if (status === 'bloqueio') {
                idRegStatus.setAttribute("disabled", true);
                elements.forEach(element => {
                    element.removeAttribute("disabled");
                });

            } else {
                idRegStatus.removeAttribute("disabled");
                elements.forEach(element => {
                    if (element.getAttribute('id') === 'qtde') {
                        element.removeAttribute("disabled");
                        return;
                    }
                    element.setAttribute("disabled", true);
                });
            }
        }

        function handleFormSubmit(form) {
            event.preventDefault();

            modalMessage.textContent = "Enviando formulário, aguarde...";
            loadingModal.show();

            const formData = new FormData(form);
            const formObject = Object.fromEntries(formData);

            if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
                setTimeout(() => {
                    console.log("Form submitted:", formObject);
                    loadingModal.hide();
                    form.reset();
                    toggleRequiredFields();
                }, 2000);
            } else {
                google.script.run
                    .withSuccessHandler(() => {
                        loadingModal.hide();
                        form.reset();
                        toggleRequiredFields();
                    })
                    .withFailureHandler((error) => {
                        loadingModal.hide();
                        console.error(error);
                    })
                    .processForm(formObject);
            }
        }

    </script>

</body>

</html>
