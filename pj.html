<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        span,
        small {
            font-family: 'Montserrat', sans-serif;
        }

            max-width: 3%;

        }

<body>
    <div class="ms-5">
        <header class="fixed-top bg-light px-5 py-2 w-100">
            <div class="d-flex align-items-center justify-content-between">
                <img src="https://i.postimg.cc/Y9pv6ZLR/pjlogo.jpg" alt="pjlogo">
                <span class="navbar-brand text-danger fw-bold fs-1 d-block d-md-inline text-uppercase"

                    <span class="text-secondary fw-semibold text-warning d-md-inline text-uppercase">Variedades</span>
                </span>
                <button class="btn btn-primary text-uppercase fw-semibold" id="finishPurchaseBtn"

                    Fechar Venda
                </button>
            </div>

        <main class="mt-5 pt-5 d-flex flex-column" style="height: calc(100vh - 0px - 125px); overflow: hidden;">
            <!-- Lista de Produtos e Carrinho -->
            <section class="row flex-grow-1 overflow-hidden h-100">
                <div class="col-lg-8 col-md-7 d-flex flex-column h-100">
                    <div class="row align-items-center mb-3">
                        <div class="col-12 col-md-4 mb-2 mb-md-0">
                            <h2 class="mb-2 text-uppercase p-2">Produtos</h2>
                        </div>
                        <div class="col-md-12 d-flex">
                            <div class="input-group">
                                <input type="search" id="searchInput" class="form-control" autocomplete="off"
                                    placeholder="Pesquisar produto por código ou nome">
                            </div>
                            <div class="ms-2 col-md-auto">
                                <button class="btn btn-primary btn-small text-uppercase fw-semibold"
                                    data-bs-toggle="modal" data-bs-target="#customSaleModal">Avulsa</button>
                            </div>
                        </div>
                    </div>
                    <div class="flex-grow-1 overflow-auto" id="productList">
                        <!-- Produtos serão adicionados aqui dinamicamente -->
                        <div class="table-responsive" style="max-height: 100%; overflow: auto;">
                            <table class="table table-hover table-striped">
                                <thead class="sticky-top bg-light">
                                    <tr>
                                        <th scope="col" class="text-uppercase">Produto</th>
                                        <th scope="col" class="text-uppercase">Preço</th>
                                        <th scope="col" class="text-uppercase">Estoque</th>
                                        <th scope="col" class="text-uppercase">Ação</th>
                                    </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4 col-md-5 d-flex flex-column h-100 px-2">
                    <div class="sticky-top bg-white d-flex justify-content-center align-items-center">
                        <h2 class="mb-0 text-center text-uppercase p-2">
                            Carrinho<span class="badge bg-secondary ms-3" id="cartBadge">0</span></h2>
                    </div>
                    <div class="flex-grow-1 overflow-auto">
                        <ul id="cartList" class="list-group mb-3">
                            <!-- Itens do carrinho serão adicionados aqui dinamicamente -->
                        </ul>
                    </div>
                    <div class="sticky-bottom bg-white pt-1 border-top px-1">
                        <div class="row align-items-center">
                            <div class="col-12 mt-1 mb-1">
                                <div class="form-group d-flex align-items-center">
                                    <div class="input-group">
                                        <span class="input-group-text fw-bold text-uppercase">Desconto</span>
                                        <input type="search" id="discountInput" inputmode="decimal"
                                            class="form-control form-control-lg" placeholder="R$ 0,00"
                                            data-currency="BRL" autocomplete="off">
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 mt-1 mb-1">
                                <div class="form-group d-flex align-items-center">
                                    <div class="input-group">
                                        <span
                                            class="input-group-text fw-bold text-danger text-uppercase fs-1">Total</span>

                                        <input disabled type="text" id="cartTotal"
                                            class="form-control form-control-lg text-danger fw-bold fs-1"
                                            placeholder="R$ 0,00" data-currency="BRL">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer class="fixed-bottom bg-light p4 mt-1">
            <div class="shortcut-helpers p-4">
                <div class="ms-5">
                    <div class="row">
                        <div class="col">
                            <kbd>F1</kbd><small class="ms-2 fw-semibold">Buscar produto</small>
                        </div>
                        <div class="col">
                            <kbd>F2</kbd><small class="ms-2 fw-semibold">Venda avulsa</small>
                        </div>
                        <div class="col">
                            <kbd>F3</kbd><small class="ms-2 fw-semibold">Fechar venda</small>
                        </div>
                        <div class="col">
                            <kbd>F4</kbd><small class="ms-2 fw-semibold">Desconto</small>
                        </div>
                        <div class="col">
                            <kbd>F11</kbd><small class="ms-2 fw-semibold">Abrir/Fechar tela cheia</small>
                        </div>
                    </div>
                </div>
        </footer>
        <!-- Modal para Venda Avulsa -->
        <div class="modal fade" id="customSaleModal" tabindex="-1" aria-labelledby="customSaleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold text-uppercase" id="customSaleModalLabel">Venda Avulsa</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="customSaleForm">
                            <div class="mb-3">
                                <label for="customProductName" class="form-label text-uppercase">Nome do Produto</label>
                                <input type="search" class="form-control" id="customProductName"
                                    value="PRODUTOS VARIADOS" required>
                            </div>
                            <div class="mb-3">
                                <label for="customProductPrice" class="form-label text-uppercase">Valor</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="customProductPrice" data-currency="BRL"
                                        autocomplete="off" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="customProductMeasure" class="form-label text-uppercase">Metragem</label>
                                <div class="input-group mb-3">
                                    <div class="input-group-text">
                                        <input class="form-check-input mt-0" type="checkbox"
                                            id="customProductMeasureCheck"
                                            aria-label="Checkbox for following text input">
                                    </div>
                                    <input type="search" inputmode="numeric" class="form-control" disabled
                                        placeholder="0,00" id="customProductMeasure"
                                        aria-label="Text input with checkbox">
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger me-2" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-success" onclick="addCustomProduct()">Adicionar</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal de Pagamento -->
        <div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-fullscreen">
                <div class="modal-content p-3">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold text-uppercase" id="paymentModalLabel">Finalizar Venda</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" style="overflow-y: hidden;">
                        <div class="row">
                            <!-- Lado esquerdo: Listagem de produtos -->
                            <div class="col-md-6">
                                <div style="overflow-y: auto; max-height: calc(99vh - 200px);">
                                    <ul id="modalProductList" class="list-group list-group-flush">
                                        <!-- Os itens serão adicionados dinamicamente aqui -->
                                    </ul>
                                </div>
                            </div>
                            <!-- Lado direito: Formulário de pagamento -->
                            <div class="col-md-6">
                                <form id="paymentForm" autocomplete="off">
                                    <div class="row mb-3" id="payments">
                                        <div class="col-3 d-grid mx-auto"> <input type="radio" class="btn-check"
                                                data-payment="PIX" data-testid="radioPix" name="payment-options"
                                                id="pix-outlined" autocomplete="off" checked>
                                            <label class="btn btn-outline-primary" for="pix-outlined"><i
                                                    class="fa-brands fa-pix"></i><br />PIX</label>
                                        </div>
                                        <div class="col-3 d-grid mx-auto"><input type="radio" class="btn-check"
                                                data-payment="CREDITO" data-testid="radioCredit" name="payment-options"
                                                id="credit-outlined" autocomplete="off">
                                            <label class="btn btn-outline-primary" for="credit-outlined"><i
                                                    class="fa-solid fa-credit-card"></i><br />Crédito</label>
                                        </div>
                                        <div class="col-3 d-grid mx-auto"> <input type="radio" class="btn-check"
                                                data-payment="DEBITO" data-testid="radioDebit" name="payment-options"
                                                id="debit-outlined" autocomplete="off">
                                            <label class="btn btn-outline-primary" for="debit-outlined"><i
                                                    class="fa-regular fa-credit-card"></i><br />Débito</label>
                                        </div>
                                        <div class="col-3 d-grid mx-auto"> <input type="radio" class="btn-check"
                                                data-payment="DINHEIRO" data-testid="radioMoney" name="payment-options"
                                                id="money-outlined" autocomplete="off">
                                            <label class="btn btn-outline-primary" for="money-outlined"><i
                                                    class="fa-solid fa-brazilian-real-sign"></i><br />Dinheiro</label>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label for="totalAmount"
                                                class="form-label text-uppercase fw-bold">Total</label>
                                            <input type="text" class="form-control form-control-lg" id="totalAmount"
                                                name="totalAmount" placeholder="R$ 0,00" data-currency="BRL" disabled
                                                autocomplete="off">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="discountAmount"
                                                class="form-label text-uppercase fw-bold">Desconto</label>
                                            <input type="text" class="form-control form-control-lg" id="discountAmount"
                                                name="discountAmount" placeholder="R$ 0,00" data-currency="BRL" disabled
                                                autocomplete="off">
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label for="paidAmount" class="form-label text-uppercase fw-bold">Valor
                                                Pago</label>
                                            <input type="text" inputmode="numeric" class="form-control form-control-lg"
                                                name="paidAmount" id="paidAmount" placeholder="R$ 0,00"
                                                data-currency="BRL" autocomplete="off">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="changeAmount"
                                                class="form-label text-uppercase fw-bold">Troco</label>
                                            <input type="text" class="form-control form-control-lg" id="changeAmount"
                                                disabled placeholder="R$ 0,00" data-currency="BRL" readonly>
                                        </div>
                                        <div class="col-md-12 mt-3">
                                            <!-- <label class="form-label">Pagamentos Parciais</label> -->
                                            <ul class="list-group list-group-flush" id="partialPaymentsList">
                                                <!-- Partial payments will be added here dynamically -->
                                            </ul>
                                        </div>
                                    </div>

                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger btn-lg" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary btn-lg" id="confirmPayment"
                            onclick="handlePayment()">Confirmar</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Toast -->
        <div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 9999">
            <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header bg-danger text-white">
                    <strong class="me-auto">Mensagem</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"
                        aria-label="Close"></button>
                </div>
                <div class="toast-body">
                    <p id="toastMessage"></p>
                </div>
            </div>
        </div>
        <div class="modal fade" id="loadingModal" aria-hidden="true" aria-labelledby="loadingModalLabel" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body text-center">
                        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <h5 class="mt-3">Por favor, aguarde...</h5>
                        <p>Enquanto a venda é processada.</p>
                    </div>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>

        //Global Variables
        const url = 'https://script.google.com/macros/s/AKfycbyMw4O_P29dZgzo0Y1kGl7bmN2LJvRSNU2ssr5uiM3BkS1e3nFox2sjoBdjggdyRTOc/exec';
        // let dbProducts = JSON.parse(localStorage.getItem('dbProducts'));
        let cart = JSON.parse(localStorage.getItem('cart')) || []
        let discount = 0;
        let totalToPay = 0

        //DOM Elements
        const paymentModal = new bootstrap.Modal(document.getElementById('paymentModal'));
        const toast = new bootstrap.Toast('#liveToast');
        const toastMessage = document.getElementById('toastMessage');
        const customSaleModal = new bootstrap.Modal(document.getElementById('customSaleModal'));
        const modalProductList = document.getElementById('modalProductList');
        const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'));

        //DOM Events
        document.addEventListener('DOMContentLoaded', async function () {
            init()
        })

        /**
         * Manipula eventos de tecla pressionada para atalhos globais.
         *
         * @function
         * @name globalKeydownHandler
         * @param {KeyboardEvent} event - O evento de tecla pressionada.
         * @description
         * Esta função é um manipulador de eventos para teclas pressionadas em todo o documento.
         * Ela implementa os seguintes atalhos de teclado:
         * - F1: Foca no campo de busca de produtos.
         * - F2: Abre o modal de venda avulsa.
         * - F3: Abre o modal de pagamento, removendo o foco do campo de desconto se necessário.
         * - F4: Foca no campo de desconto.
         * 
         * Para cada atalho, a função previne o comportamento padrão da tecla.
         *
         * @listens keydown
         * @example
         * // Este evento é acionado automaticamente quando uma tecla é pressionada no documento
         * document.addEventListener('keydown', globalKeydownHandler);
         */
        document.addEventListener('keydown', function (event) {
            switch (event.key) {
                case 'F1':
                    event.preventDefault();
                    document.getElementById('searchInput').focus();
                    break;
                case 'F2':
                    event.preventDefault();
                    customSaleModal.show()
                    break;
                case 'F3':
                    event.preventDefault();
                    if (document.activeElement === document.getElementById("discountInput")) {
                        document.getElementById("discountInput").blur();
                    }
                    openPaymentModal();
                    break;
                case 'F4':
                    event.preventDefault();
                    document.getElementById("discountInput").focus()
                    break;
                default:
                    break;
            }

        });

        /**
         * Manipula o evento de entrada no campo de pesquisa de produtos.
         *
         * @function
         * @name searchInputHandler
         * @param {Event} e - O evento de entrada.
         * @description
         * Esta função é um manipulador de eventos para o campo de pesquisa de produtos.
         * Ela realiza as seguintes operações:
         * 1. Obtém o termo de pesquisa do valor do input e o converte para maiúsculas.
         * 2. Filtra a lista de produtos (dbProducts) com base no termo de pesquisa.
         *    A filtragem é feita comparando o termo com o código e o nome do produto.
         * 3. Chama a função displayProducts com a lista filtrada de produtos.
         *
         * @listens input
         * @example
         * // Este evento é acionado automaticamente quando o usuário digita no campo de pesquisa
         * document.getElementById('searchInput').addEventListener('input', searchInputHandler);
         */
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toUpperCase();
            const filteredProducts = dbProducts.filter(product =>
                String(product.code).includes(searchTerm) ||
                product.name.toUpperCase().includes(searchTerm)
            );
            displayProducts(filteredProducts);
        });

        /**
         * Manipula o evento de entrada no campo de desconto.
         *
         * @function
         * @name discountInputHandler
         * @param {Event} event - O evento de entrada.
         * @description
         * Esta função é um manipulador de eventos para o campo de desconto.
         * Ela realiza as seguintes operações:
         * 1. Verifica se o carrinho está vazio.
         * 2. Se o carrinho estiver vazio:
         *    - Limpa o valor do campo de desconto.
         *    - Exibe uma mensagem de erro usando a função showToast.
         *    - Interrompe a execução da função.
         *
         * @listens input
         * @example
         * // Este evento é acionado automaticamente quando o usuário digita no campo de desconto
         * document.getElementById('discountInput').addEventListener('input', discountInputHandler);
         */
        document.getElementById('discountInput').addEventListener('blur', (e) => {
            const discountValue = brazilianCurrencyToNumber(e.target.value);
            const currentTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            if (discountValue > currentTotal) {
                showToast('O desconto não pode ser maior que o total da compra.', 'error');
                e.target.value = '';
                e.target.placeholder = 'R$ 0,00';
                discount = 0;
            } else {
                discount = parseFloat(discountValue || 0);
            }
            updateShoppingCart();
        });

        /**
         * Manipula o evento de entrada no campo de desconto.
         *
         * @function
         * @name discountInputHandler
         * @param {Event} event - O evento de entrada.
         * @description
         * Esta função é um manipulador de eventos para o campo de desconto.
         * Ela realiza as seguintes operações:
         * 1. Verifica se o carrinho está vazio.
         * 2. Se o carrinho estiver vazio:
         *    - Limpa o valor do campo de desconto.
         *    - Exibe uma mensagem de erro usando a função showToast.
         *    - Interrompe a execução da função.
         *
         * @listens input
         * @example
         * // Este evento é acionado automaticamente quando o usuário digita no campo de desconto
         * document.getElementById('discountInput').addEventListener('input', discountInputHandler);
         */
        document.getElementById('discountInput').addEventListener('input', function (event) {
            if (cart.length === 0) {
                event.target.value = '';
                showToast('Não é possível aplicar desconto em um carrinho vazio.', 'error');
                return
            }
        });

        /**
         * Formata os campos de entrada de moeda para o formato brasileiro (BRL).
         *
         * @function
         * @name formatCurrencyInputs
         * @description
         * Esta função adiciona um evento de entrada a todos os elementos de input com o atributo data-currency="BRL".
         * Para cada entrada, ela realiza as seguintes operações:
         * 1. Remove todos os caracteres não numéricos do valor inserido.
         * 2. Converte o valor para centavos e adiciona duas casas decimais.
         * 3. Substitui o ponto decimal por vírgula.
         * 4. Adiciona separadores de milhar (pontos).
         * 5. Adiciona o prefixo "R$ " ao valor formatado.
         *
         * @listens input
         * @example
         * // Este código é executado automaticamente, formatando todos os inputs de moeda
         * document.querySelectorAll('[data-currency="BRL"]').forEach(input => {
         *     input.addEventListener('input', function (e) {
         *         // Lógica de formatação...
         *     });
         * });
         */
        document.querySelectorAll('[data-currency="BRL"]').forEach(input => {
            input.addEventListener('input', function (e) {
                let value = e.target.value;
                value = value.replace(/\D/g, "");
                value = (value / 100).toFixed(2) // Adiciona casas decimais
                    .replace(".", ",")           // Substitui ponto por vírgula
                    .replace(/\B(?=(\d{3})+(?!\d))/g, "."); // Adiciona separador de milhares
                e.target.value = value ? `R$ ${value}` : "";
            });
        });

        /**
         * Manipula o evento de tecla pressionada para abrir o modal de venda personalizada.
         *
         * @function
         * @name customSaleModalShortcutHandler
         * @param {KeyboardEvent} event - O evento de tecla pressionada.
         * @description
         * Este manipulador de eventos é acionado quando uma tecla é pressionada no documento.
         * Ele realiza as seguintes operações:
         * 1. Verifica se a tecla Alt e a tecla 'A' foram pressionadas simultaneamente.
         * 2. Se a combinação for detectada, abre o modal de venda personalizada.
         * 
         * @listens keydown
         * @example
         * // Este evento é acionado automaticamente quando uma tecla é pressionada no documento
         * document.addEventListener('keydown', customSaleModalShortcutHandler);
         */
        document.addEventListener('keydown', function (event) {
            if (event.altKey && event.code === 'KeyA') {
                customSaleModal.show(); // Open the avulsa modal
            }
        });

        /**
         * Manipula o evento de entrada no campo de valor pago.
         *
         * @function
         * @name paidAmountInputHandler
         * @param {Event} e - O evento de entrada.
         * @description
         * Esta função é um manipulador de eventos para o campo de valor pago.
         * Ela realiza as seguintes operações:
         * 1. Converte o valor pago inserido para número.
         * 2. Obtém o valor total da compra.
         * 3. Calcula o troco se o valor pago for maior que o total.
         * 4. Atualiza o campo de troco com o valor calculado ou zero.
         *
         * @listens input
         * @example
         * // Este evento é acionado automaticamente quando o usuário digita no campo de valor pago
         * document.getElementById('paidAmount').addEventListener('input', paidAmountInputHandler);
         */
        document.getElementById('paidAmount').addEventListener('input', function (e) {
            const paidAmount = brazilianCurrencyToNumber(e.target.value);
            const totalAmount = brazilianCurrencyToNumber(document.getElementById('totalAmount').value);

            if (paidAmount > totalAmount) {
                const change = paidAmount - totalAmount;
                document.getElementById('changeAmount').value = numberToBrazilianCurrency(change);
            } else {
                document.getElementById('changeAmount').value = 'R$ 0,00';
            }
        });

        /**
         * Manipula o evento de tecla pressionada no campo de valor pago.
         *
         * @function
         * @name paidAmountKeydownHandler

         * @param {Event} e - O evento de input.
         * @description
         * Esta função é um manipulador de eventos para o campo de entrada de medida personalizada.
         * Ela realiza as seguintes operações:
         * 1. Remove todos os caracteres não numéricos do valor inserido.
         * 2. Converte o valor para um número com duas casas decimais.
         * 3. Formata o número para o padrão brasileiro de moeda (vírgula como separador decimal e ponto como separador de milhar).
         * 4. Atualiza o valor do campo de entrada com o valor formatado.
         *
         * @example
         * // Este evento é acionado automaticamente quando o usuário digita no campo de medida personalizada
         * document.getElementById('customProductMeasure').addEventListener('input', customProductMeasureInputHandler);
         */
        document.getElementById('customProductMeasure').addEventListener('input', function (e) {
            let value = e.target.value;
            value = value.replace(/\D/g, "");
            value = (value / 100).toFixed(2) // Adiciona casas decimais
                .replace(".", ",")           // Substitui ponto por vírgula
                .replace(/\B(?=(\d{3})+(?!\d))/g, "."); // Adiciona separador de milhares
            e.target.value = value ? `${value}` : "";
        });

        function addToCart(id) {

        /**

         * @description
         * Esta função realiza as seguintes operações:
         * 1. Procura um item existente no carrinho com o ID fornecido.
         * 2. Se o item for encontrado:
         *    a. Se a quantidade for 1 ou menos, remove o item do carrinho.
         *    b. Se a quantidade for maior que 1, decrementa a quantidade em 1.
         * 3. Atualiza o carrinho no localStorage.
         * 4. Atualiza a exibição do carrinho de compras.
         * 5. Atualiza o estoque do produto.
         *
         * @example
         * // Decrementa a quantidade do produto com ID '123' no carrinho
         * decrementQuantity('123');
         */
        function decrementQuantity(id) {
            const existingItem = cart.find(item => item.id == id);

            if (existingItem) {
                if (existingItem.quantity <= 1) {
                    removeFromCart(id);
                    return
                } else {
                    existingItem.quantity -= 1;
                }

                localStorage.setItem('cart', JSON.stringify(cart));
            }

            updateShoppingCart();
            updateProductStock(id, 'remove')
        }

        /**
         * Atualiza o estoque de um produto após uma operação de adição ou remoção.
         *
         * @function
         * @name updateProductStock
         * @param {string} id - O ID do produto cujo estoque será atualizado.
         * @param {string} action - A ação a ser realizada ('add' para adicionar ao carrinho, 'remove' para remover do carrinho).
         * @description
         * Esta função realiza as seguintes operações:
         * 1. Encontra o produto no banco de dados usando o ID fornecido.
         * 2. Atualiza o estoque do produto com base na ação:
         *    - Se a ação for 'add', diminui o estoque.
         *    - Se a ação for 'remove', aumenta o estoque.
         * 3. Trata de forma diferente produtos vendidos por unidade (UN) e por metro (M).
         * 4. Atualiza a exibição do estoque na interface do usuário.
         *
         * @example
         * // Atualiza o estoque após adicionar o produto com ID '123' ao carrinho
         * updateProductStock('123', 'add');
         *
         * @example
         * // Atualiza o estoque após remover o produto com ID '456' do carrinho
         * updateProductStock('456', 'remove');
         */
        function updateProductStock(id, action) {
            const product = dbProducts.find(product => product.id == id);

            if (action === 'add') {
                product.unit === 'M' ? product.stock = Math.round((product.stock - 1) * 100) : product.stock -= 1
            } else if (action === 'remove') {
                product.unit === 'M' ? product.stock = Math.round((product.stock + 1) * 100) : product.stock += 1
            }

            const stockElement = document.getElementById(`stock-${product.id}`);
            stockElement.textContent = `${product.stock}${product.unit}`;
        }

        /**
         * Adiciona um produto personalizado ao carrinho de compras.
         *
         * @function
         * @name addCustomProduct
         * @description
         * Esta função realiza as seguintes operações:
         * 1. Obtém os valores dos campos do modal de produto personalizado.
         * 2. Verifica se o produto já existe no banco de dados.
         * 3. Se o produto existir e for vendido por metro:
         *    a. Arredonda a medida para 2 casas decimais.
         *    b. Atualiza o estoque do produto.
         *    c. Adiciona ou atualiza o item no carrinho.
         * 4. Se o produto não existir ou não for vendido por metro:
         *    a. Cria um novo produto personalizado.
         *    b. Adiciona o novo produto ao carrinho.
         * 5. Atualiza a exibição do carrinho e fecha o modal.
         * 6. Limpa os campos do modal após a adição.
         *
         * @throws {Error} Exibe um toast de erro se os campos necessários não forem preenchidos.
         *
         * @example
         * // Chama a função quando o usuário confirma a adição de um produto personalizado
         * addCustomProduct();
         */
        function addCustomProduct() {
            const customProductName = document.getElementById('customProductName').value;
            const customProductPrice = document.getElementById('customProductPrice').value;
            const measureInput = document.getElementById('customProductMeasure');
            const measure = parseFloat(measureInput.value.replace(',', '.'));

            const product = dbProducts.find(product => product.name === customProductName);

            if (product) {
                if (product.unit === 'M') {
                    // Arredonda para 2 casas decimais
                    const roundedMeasure = Math.round(measure * 100) / 100;

                    // Atualiza o estoque com precisão de 2 casas decimais
                    product.stock = Math.round((product.stock - roundedMeasure) * 100) / 100;

                    const existingItem = cart.find(item => item.id === product.id);
                    if (existingItem) {
                        existingItem.quantity = Math.round((existingItem.quantity + roundedMeasure) * 100) / 100;
                    } else {
                        cart.push({ ...product, quantity: roundedMeasure });
                    }

                    updateProductStock(product.id, 'add');
                    updateShoppingCart();
                    customSaleModal.hide();
                }
                else {
                    // Lógica para adicionar um produto personalizado que não está no dbProducts
                    if (customProductName && customProductPrice) {
                        const customProduct = {
                            id: Date.now().toString(),
                            code: "",
                            name: customProductName.toUpperCase(),
                            price: brazilianCurrencyToNumber(customProductPrice),
                            quantity: isNaN(measure) ? 1 : Math.round(measure * 100) / 100,
                            unit: isNaN(measure) ? 'UN' : 'M'
                        };
                        cart.push(customProduct);
                        updateShoppingCart();
                        customSaleModal.hide();
                    } else {
                        showToast('Por favor, preencha todos os campos necessários.', 'error');
                    }
                }
            }

            // Limpa os campos do modal
            document.getElementById('customProductName').value = '';
            document.getElementById('customProductPrice').value = '';
            measureInput.value = '';
        }

         * @example

         * // Se o carrinho tiver 12 itens, o badge mostrará "12"
         * updateCartBadge();
         */
        function updateCartBadge() {
            document.getElementById('cartBadge').textContent = String(cart.length).padStart(2, '0');
        }

         * Remove um item do carrinho de compras e atualiza o estoque.
         *
         * @function
         * @name removeFromCart
         * @param {string} id - O ID do produto a ser removido do carrinho.
         * @description

         * 1. Localiza o item no carrinho pelo ID fornecido.
         * 2. Se o item for encontrado:
         *    a. Remove o item do array do carrinho.
         *    b. Atualiza o estoque do produto, adicionando a quantidade removida de volta.
         *    c. Atualiza a exibição do carrinho de compras na interface.
         *    d. Atualiza o indicador numérico (badge) do carrinho.
         *
         * @example
         * // Remove o produto com ID '123' do carrinho
         * removeFromCart('123');
         */
        function removeFromCart(id) {
            const index = cart.findIndex(item => item.id == id);
            if (index !== -1) {
                const removedItem = cart.splice(index, 1)[0];

                updateProductStock(id, 'remove');

        /**
         * Atualiza a quantidade de um item no carrinho e ajusta o estoque correspondente.
         *
         * @function
         * @name updateQuantity
         * @param {string} id - O ID do produto a ser atualizado.
         * @param {number|string} newQuantity - A nova quantidade do produto. Pode ser um número ou uma string que representa um número.
         * @description
         * Esta função realiza as seguintes operações:
         * 1. Encontra o item no carrinho e o produto correspondente no banco de dados.
         * 2. Converte a nova quantidade para um número, tratando casos de inteiros e decimais.
         * 3. Valida se a nova quantidade é um número válido e maior que zero.
         * 4. Calcula a diferença entre a nova quantidade e a antiga.
         * 5. Atualiza a quantidade do item no carrinho.
         * 6. Atualiza o estoque do produto no banco de dados.
         * 7. Atualiza a exibição do estoque na interface do usuário.
         * 8. Salva as alterações no localStorage.
         * 9. Atualiza a exibição do carrinho de compras.
         *
         * @throws {Error} Exibe um toast de erro se a quantidade fornecida for inválida.
         *
         * @example
         * // Atualiza a quantidade de um produto para 5
         * updateQuantity('123', 5);
         *
         * @example
         * // Atualiza a quantidade de um produto para 2,5 (para produtos vendidos por peso ou medida)
         * updateQuantity('456', '2,5');
         */
        function updateQuantity(id, newQuantity) {
            const item = cart.find(item => item.id == id);

            const product = dbProducts.find(product => product.id == id);
            var quantityDifference = 0

            if (item) {
                if (Number.isInteger(newQuantity)) {
                    newQuantity = parseInt(newQuantity);
                } else {
                    newQuantity = parseFloat(newQuantity.replace(',', '.'));
                }

                if (isNaN(newQuantity) || newQuantity < 1) {
                    showToast('Quantidade inválida. Por favor, insira um número maior que  0(zero).', 'error');
                    return;
                }

                const oldQuantity = item.quantity;
                quantityDifference = newQuantity - oldQuantity;

                item.quantity = newQuantity;
                localStorage.setItem('cart', JSON.stringify(cart));

            }

            if (product) {
                product.stock -= quantityDifference;
                document.getElementById(`stock-${product.id}`).textContent = `${product.stock}${product.unit}`;
                localStorage.setItem('dbProducts', JSON.stringify(dbProducts));
            }

            updateShoppingCart();
        }

        /**
         * Exibe uma mensagem de toast com um tipo específico.
         *
         * @function
         * @name showToast
         * @param {string} message - A mensagem a ser exibida no toast.
         * @param {string} type - O tipo de toast ('success', 'error', 'warning', ou 'info' por padrão).
         * @description
         * Esta função cria e exibe um toast personalizado com uma mensagem e um ícone
         * correspondente ao tipo especificado. O toast é estilizado de acordo com o tipo,
         * usando classes Bootstrap para cores de fundo e ícones Font Awesome.
         *
         * @example
         * // Exibe um toast de sucesso
         * showToast('Operação realizada com sucesso!', 'success');
         *
         * @example
         * // Exibe um toast de erro
         * showToast('Ocorreu um erro.', 'error');
         */
        function showToast(message, type) {
            toastMessage.textContent = message;
            const toastHeader = document.querySelector('.toast-header');
            const toastIcon = document.createElement('i');

            toastHeader.classList.remove('bg-success', 'bg-danger', 'bg-warning', 'bg-info');

            switch (type) {
                case 'success':
                    toastHeader.classList.add('bg-success');
                    toastIcon.className = 'fas fa-check-circle me-2';
                    break;
                case 'error':
                    toastHeader.classList.add('bg-danger');
                    toastIcon.className = 'fas fa-exclamation-circle me-2';
                    break;
                case 'warning':
                    toastHeader.classList.add('bg-warning');
                    toastIcon.className = 'fas fa-exclamation-triangle me-2';
                    break;
                default:
                    toastHeader.classList.add('bg-info');
                    toastIcon.className = 'fas fa-info-circle me-2';
            }

            const existingIcon = toastHeader.querySelector('i');
            if (existingIcon) {
                existingIcon.remove();
            }

            toastHeader.prepend(toastIcon);
            toast.show();
        }

        /**
         * Converte um número para o formato de moeda brasileira.
         *
         * @function
         * @name numberToBrazilianCurrency
         * @param {number} number - O número a ser convertido para o formato de moeda brasileira.
         * @returns {string} Uma string representando o valor no formato de moeda brasileira (ex: "R$ 1.234,56").
         * @description
         * Esta função utiliza o método toLocaleString para formatar o número de acordo com as convenções
         * de moeda brasileira, incluindo o símbolo "R$", separadores de milhar e vírgula como separador decimal.
         *
         * @example
         * // Retorna "R$ 1.234,56"
         * numberToBrazilianCurrency(1234.56);
         *
         * @example
         * // Retorna "R$ 1.000,00"
         * numberToBrazilianCurrency(1000);
         */
        function numberToBrazilianCurrency(number) {
            return parseFloat(number).toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL",
            });
        }

        /**
         * Converte um valor em formato de moeda brasileira para um número.
         *
         * @function
         * @name brazilianCurrencyToNumber
         * @param {string} currency - O valor em formato de moeda brasileira (ex: "R$ 1.234,56").
         * @returns {number} O valor convertido para número.
         * @description
         * Esta função realiza as seguintes operações:
         * 1. Verifica se a string já inclui "R$", adicionando se necessário.
         * 2. Remove o símbolo "R$" e espaços em branco.
         * 3. Remove todos os pontos (separadores de milhar).
         * 4. Substitui a vírgula (separador decimal) por ponto.
         * 5. Converte a string resultante para um número de ponto flutuante.
         *
         * @example
         * // Retorna 1234.56
         * brazilianCurrencyToNumber("R$ 1.234,56");
         *
         * @example
         * // Retorna 1234.56
         * brazilianCurrencyToNumber("1.234,56");
         */
        function brazilianCurrencyToNumber(currency) {
            if (!currency.includes("R$")) {
                currency = `R$ ${currency}`
            }

            let cleanValue = currency.replace("R$", "").trim();
            cleanValue = cleanValue.replace(/\./g, "");
            cleanValue = cleanValue.replace(",", ".");
            return parseFloat(cleanValue);
        }

        /**
         * Abre o modal de pagamento e preenche com os detalhes do carrinho atual.
         * 
         * @function
         * @name openPaymentModal
         * @description
         * Esta função realiza as seguintes operações:

         * 2. Verifica se o carrinho está vazio e exibe uma mensagem de erro se estiver.
         * 3. Verifica se já existe um toast sendo exibido.
         * 4. Reseta o formulário de pagamento.
         * 5. Calcula o total da venda, considerando o desconto.
         * 6. Preenche os campos de valor total e desconto no modal.
         * 7. Limpa e preenche a lista de produtos no modal com os itens do carrinho.

         */
        function openPaymentModal() {
            document.getElementById('paidAmount').focus()

                showToast('O carrinho está vazio. Adicione itens antes de prosseguir com a venda.', 'error');
                return;
            }

            if (toast._element.classList.contains('show')) return;

            document.getElementById('paymentForm').reset();

            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0) - discount;
            document.getElementById('totalAmount').value = numberToBrazilianCurrency(total);
            document.getElementById('discountAmount').value = numberToBrazilianCurrency(discount);

            modalProductList.innerHTML = '';
            cart.forEach(item => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.innerHTML = `
                    <div class="d-flex flex-column w-100">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <small class="badge ${item.code ? 'bg-secondary' : 'bg-danger'}">${item.code ? item.code : 'SEM CADASTRO'}</small>
                            <small class="text-muted">${item.quantity}x ${numberToBrazilianCurrency(item.price)}</small>
                        </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-truncate ms-2" style="max-width: 400px;" title="${item.name}">${item.name}</small>
                            <span class="text-danger fw-bold">${numberToBrazilianCurrency(item.price * item.quantity)}</span>
                        </div>

                `;
                modalProductList.appendChild(li);

        }

        /**
         * Processa o pagamento de uma venda.
         *
         * @async
         * @function
         * @name handlePayment
         * @description
         * Esta função gerencia o processo de pagamento, incluindo:
         * - Validação do valor pago
         * - Atualização da lista de métodos de pagamento
         * - Cálculo de troco ou pagamento parcial
         * - Preparação dos dados da venda
         * - Registro da venda no sistema
         * - Limpeza do carrinho após a conclusão da venda
         *
         * @returns {Promise<void>}
         * @throws {Error} Lança um erro se houver problemas durante o processamento do pagamento.
         *
         * @example
         * // Chamar a função quando o botão de pagamento for clicado
         * paymentButton.addEventListener('click', handlePayment);
         */
        function getPaymentMethod() {
            let paymentMethods = document.querySelectorAll(`[data-testid*="radio"]`);
            let checkedRadio = Array.from(paymentMethods).find(radio => radio.checked);
            return checkedRadio ? checkedRadio.dataset.payment || null : null;
        }

        /**
         * Processa o pagamento de uma venda.
         *
         * @async
         * @function
         * @name handlePayment
         * @description
         * Esta função gerencia o processo de pagamento, incluindo:
         * - Validação do valor pago
         * - Atualização da lista de métodos de pagamento
         * - Cálculo de troco ou pagamento parcial
         * - Preparação dos dados da venda
         * - Registro da venda no sistema
         * - Limpeza do carrinho após a conclusão da venda
         *
         * @returns {Promise<void>}
         * @throws {Error} Lança um erro se houver problemas durante o processamento do pagamento.
         *
         * @example
         * // Chamar a função quando o botão de pagamento for clicado
         * paymentButton.addEventListener('click', handlePayment);
         */
        async function handlePayment() {
            const totalAmountEl = document.getElementById('totalAmount')
            const discountAmountEl = document.getElementById('discountAmount')
            const paidAmountEl = document.getElementById('paidAmount')
            const changeAmountEl = document.getElementById('changeAmount')

            if (!paidAmountEl.value.trim()) {
                showToast('Por favor, insira o valor para pagamento.', 'error');
                return;
            }

            let paidAmount = brazilianCurrencyToNumber(paidAmountEl.value)
            let totalAmount = brazilianCurrencyToNumber(totalAmountEl.value)
            let discountAmount = brazilianCurrencyToNumber(discountAmountEl.value)

            if (paidAmount < totalAmount) {
                updatePaymentMethodList(getPaymentMethod(), paidAmount);
                paidAmountEl.value = '';
                const newTotalAmount = totalAmount - paidAmount;
                totalAmountEl.value = numberToBrazilianCurrency(newTotalAmount)
                return;
            }

            updatePaymentMethodList(getPaymentMethod(), paidAmount);
            paidAmountEl.value = '';
            const newTotalAmount = totalAmount - paidAmount;
            totalAmountEl.value = ''

            let methodsPaid = Array.from(document.querySelectorAll('#paymentType')).map(el => el.innerText);
            let amountPaid = Array.from(document.querySelectorAll('#amountPaid')).map(el => el.innerText);

            let paymentMethods = methodsPaid.map((method, index) => ({
                method,
                amount: amountPaid[index]
            }));

            let products = cart.map(product => ({
                id: product.id,
                code: product.code,
                name: product.name,
                quantity: product.quantity,
                price: product.price
            }));

            let formData = {
                products,
                discountAmount,
                paymentMethods
            };

            loadingModal.show();

            await postSale(formData);

            cart = [];
            showToast('Venda realizada com sucesso!', 'success');
            paymentModal.hide();
            updatePaymentMethodList("", 0, true);
            init()
        }

        /**
         * Envia os dados da venda para processamento no servidor usando Google Apps Script.
         *
         * @async
         * @function
         * @name postSale
         * @param {Object} data - Os dados da venda a serem enviados.
         * @param {Array} data.products - Lista de produtos vendidos.
         * @param {number} data.discountAmount - Valor do desconto aplicado.
         * @param {Array} data.paymentMethods - Métodos de pagamento utilizados.
         * @returns {Promise<void>} Uma promessa que resolve quando a venda é processada com sucesso.
         * @throws {Error} Lança um erro se houver falha no processamento da venda.
         * @description
         * Esta função faz o seguinte:
         * 1. Envia os dados da venda para o servidor usando google.script.run.
         * 2. Exibe uma mensagem de sucesso e limpa o carrinho se a venda for bem-sucedida.
         * 3. Exibe uma mensagem de erro se houver falha no processamento.
         * 4. Esconde o modal de carregamento após a conclusão, independentemente do resultado.
         *
         * @example
         * // Exemplo de uso:
         * const saleData = {
         *   products: [{id: 1, name: 'Produto A', quantity: 2, price: 10.00}],
         *   discountAmount: 5.00,
         *   paymentMethods: [{method: 'Cartão', amount: 15.00}]
         * };
         * await postSale(saleData);
         */
        function postSale(data) {
            return new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler(resolve)
                    .withFailureHandler(reject)
                    .postPaymentGAS(data);
            }).then(response => {
                console.log('Response:', response);
                showToast('Venda finalizada com sucesso!', 'success');
                clearCart();
                paymentModal.hide();
            }).catch(error => {
                console.error('Error:', error);
                showToast('Erro ao finalizar a venda. Tente novamente.', 'error');
            }).finally(() => {
                loadingModal.hide();
            });
        }

        /**
         * Atualiza a lista de métodos de pagamento no modal de pagamento.
         *
         * @function
         * @name updatePaymentMethodList
         * @param {string} [paymentType=''] - O tipo de pagamento a ser adicionado.
         * @param {number} [amountPaid=0] - O valor pago com este método de pagamento.
         * @param {boolean} [reset=false] - Se verdadeiro, limpa toda a lista de pagamentos.
         * @description
         * Esta função realiza as seguintes operações:
         * 1. Se não for uma operação de reset, cria um novo item de lista com o tipo de pagamento e valor.
         * 2. Adiciona o novo item à lista de pagamentos parciais.
         * 3. Se for uma operação de reset, limpa toda a lista de pagamentos.
         * 
         * @returns {void}
         */
        function paymentDateFormatter(epochDateTimer, isBegin = false) {
            const date = new Date(epochDateTimer);

            if (isBegin) {
                date.setDate(1)
            }

            return new Intl.DateTimeFormat("pt-BR", {
                day: '2-digit',
                year: 'numeric',
                month: '2-digit'
            }).format(date);
        }

        /**
         * Atualiza a lista de métodos de pagamento no modal de pagamento.
         *
         * @function
         * @name updatePaymentMethodList
         * @param {string} [paymentType=''] - O tipo de pagamento a ser adicionado.
         * @param {number} [amountPaid=0] - O valor pago com este método de pagamento.
         * @param {boolean} [reset=false] - Se verdadeiro, limpa toda a lista de pagamentos.
         * @description
         * Esta função realiza as seguintes operações:
         * 1. Se não for uma operação de reset, cria um novo item de lista com o tipo de pagamento e valor.
         * 2. Adiciona o novo item à lista de pagamentos parciais.
         * 3. Se for uma operação de reset, limpa toda a lista de pagamentos.
         * 
         * @returns {void}
         */
        function updatePaymentMethodList(paymentType = '', amountPaid = 0, reset = false) {
            if (!reset) {
                const listItem = document.createElement('li');

                `;

                return
            }
            partialPaymentsList.innerHTML = '';
        }

        /**
         * Limpa o carrinho de compras, removendo todos os itens e redefinindo o desconto.
         *
         * @function
         * @name clearCart
         * @description
         * Esta função realiza as seguintes operações:
         * 1. Esvazia o array do carrinho.
         * 2. Remove o carrinho do localStorage.
         * 3. Limpa o campo de entrada de desconto.

         */
        function clearCart() {
            cart = [];
            localStorage.removeItem('cart');
            document.getElementById('discountInput').value = ''; // Clear discount input field
            discount = 0
            updateShoppingCart();
            updateCartBadge();
        }

        /**
         * Cria e exibe um efeito de carregamento (shimmer) na tabela de produtos.
         *
         * @function
         * @name loadingShimmer
         * @description
         * Esta função gera linhas de placeholder na tabela de produtos para simular
         * um efeito de carregamento. Ela cria 10 linhas com células que contêm
         * elementos de placeholder, dando a aparência de conteúdo sendo carregado.
         * 
         * O efeito de shimmer é criado usando classes do Bootstrap como 'placeholder-glow'
         * e 'placeholder', que aplicam animações de brilho aos elementos.
         * 
         * @returns {void}
         */
        function loadingShimmer() {
            const tbody = document.querySelector('tbody');

            Array.from({ length: 10 }, function (_, i) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="placeholder-glow ">
                        <span class="placeholder col-4 rounded"></span>
                        <p class="text-truncate mt-2">
                            <span class="placeholder col-10 rounded"></span>
                        </p>
                    </td>
                    <td class="placeholder-glow">
                        <span class="placeholder col-3 rounded"></span>
                    </td>
                    <td class="placeholder-glow">
                        <span class="placeholder col-3 rounded"></span>
                    </td>
                    <td class="placeholder-glow">
                        <span class="btn brn-sm btn-primary disabled placeholder col-6 rounded"></span>
                    </td>
                `;
                tbody.appendChild(tr);
            })
        }

        /**
         * Inicializa a aplicação carregando e exibindo os produtos.
         * 
         * Esta função realiza as seguintes tarefas:
         * 1. Exibe um efeito de carregamento (shimmer).
         * 2. Verifica se a aplicação está rodando localmente ou em um servidor.
         * 3. Para desenvolvimento local, usa produtos simulados após um pequeno atraso.
         * 4. Para implantação no servidor, busca produtos usando Google Apps Script.
         * 5. Define a variável global dbProducts com os produtos obtidos ou simulados.
         * 6. Exibe os produtos na página.
         * 7. Armazena os produtos no localStorage para uso futuro.
         * 
         * @function
         * @name init
         * @returns {void}
         */
        function init() {
            loadingShimmer();

            if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
                setTimeout(() => {
                    const products = getMockProducts();
                    console.log(products);
                    dbProducts = products; // Set the global dbProducts variable
                    displayProducts(products);
                    localStorage.setItem('dbProducts', JSON.stringify(products));
                }, 1000);
            } else {
                google.script.run
                    .withSuccessHandler((products) => {
                        console.log(products);
                        dbProducts = products; // Set the global dbProducts variable
                        displayProducts(products);
                        localStorage.setItem('dbProducts', JSON.stringify(products));
                    })
                    .withFailureHandler((error) => {
                        console.error('Error:', error);
                    })
                    .getProducts();
            }
        }

        /**
         * Gera uma lista de produtos simulados para fins de teste e desenvolvimento.
         *
         * @function
         * @name getMockProducts
         * @returns {Array<Object>} Um array contendo 10 objetos de produtos simulados.
         * @description
         * Cada produto gerado possui as seguintes propriedades:
         * - id: Um número único incrementado sequencialmente.
         * - code: Um código de produto aleatório no formato 'ABC-XXX'.
         * - name: Um nome genérico no formato 'Product X'.
         * - price: Um preço aleatório entre 1 e 101, com duas casas decimais.
         * - stock: Um valor fixo de 20 unidades para todos os produtos.
         * - unit: 'M' (metro) ou 'UN' (unidade), com 90% de chance de ser 'M'.
         */
        function getMockProducts() {
            return Array.from({ length: 10 }, (_, index) => {
                return {
                    id: index + 1,
                    code: `PRODUTO-${Math.floor(Math.random() * 1000) + 1}`,
                    name: `PRODUTO ${index + 1}`,
                    price: parseFloat((Math.random() * 100 + 1).toFixed(2)),
                    stock: 20,
                    unit: Math.random() > 0.1 ? 'M' : 'UN'  // 40% chance of being 'M', otherwise 'UN'
                };
            });
        }
