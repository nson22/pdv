<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
</head>

<body>
    <div class="container-fluid py-4">
        <nav class="navbar bg-body-tertiary mb-4">
            <div class="d-flex align-items-center justify-content-between">
                <span class="text-danger text-uppercase fs-2 fw-bold">PJ</span>
                <span class="text-warning text-uppercase fs-2 ms-2 fw-bold">Contas a pagar</span>
            </div>
            <div>
                <button class="btn btn-outline-secondary me-2" type="submit">
                    <i class="bi bi-plus-lg"></i>
                </button>

                <button class="btn btn-outline-secondary" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasWithBothOptions" aria-controls="offcanvasWithBothOptions">
                    <i class="bi bi-filter"></i>
                </button>
            </div>

            <div class="offcanvas offcanvas-end" data-bs-scroll="true" tabindex="-1" id="offcanvasWithBothOptions"
                aria-labelledby="offcanvasWithBothOptionsLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasWithBothOptionsLabel"><i
                            class="bi bi-filter me-2"></i>Filtrar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <form class="row g-3">
                        <div class="col-12 mb-3">
                            <label for="startDate" class="form-label">Início</label>
                            <input type="date" class="form-control" id="startDate">
                        </div>
                        <div class="col-12 mb-3">
                            <label for="endDate" class="form-label">Fim</label>
                            <input type="date" class="form-control" id="endDate">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary w-100"><i
                                    class="bi bi-search me-2"></i>Buscar</button>
                        </div>
                    </form>
                </div>
            </div>
        </nav>

        <div class="row g-4">
            <div class="col-lg-6 col-md-6 col-12">
                <div class="card mb-4">
                    <div class="card-body placeholder-glow">
                        <div class="row align-items-center">
                            <div class="col-6">
                                <h5 class="card-title mb-0">Receita</h5>
                            </div>
                            <div class="col-6 text-end">
                                <span class="card-text fw-bold placeholder col-12" id="revenue">R$ 00,00</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card mb-4">
                    <div class="card-body placeholder-glow">
                        <div class="row align-items-center">
                            <div class="col-6">
                                <h5 class="card-title mb-0">Custo</h5>
                            </div>
                            <div class="col-6 text-end">
                                <span class="card-text fw-bold placeholder col-12" id="cost">R$ 00,00</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body placeholder-glow">
                        <div class="row align-items-center">
                            <div class="col-6">
                                <h5 class="card-title mb-0">Saldo</h5>
                            </div>
                            <div class="col-6 text-end">
                                <span class="card-text fw-bold placeholder col-12" id="profit">R$ 00,00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6 col-md-6 col-12">
                <ul class="list-group list-group" id="list">

                </ul>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbzzMdkpJoimgcsbTa4kgFtRwpPGVIXZtZAVqyk3IrWBwR5PD-FB18vL3dPGCORM2lBY/exec';
        const revenueEl = document.querySelector('#revenue');
        const costEl = document.querySelector('#cost');
        const profitEl = document.querySelector('#profit');
        const start_dateEl = document.querySelector('#startDate')
        const end_dateEl = document.querySelector('#endDate');
        const listContainer = document.querySelector('#list');

        var profit = 0

        document.addEventListener('DOMContentLoaded', initializePage);

        function initializePage() {
            listPlaceholder()
            const today = new Date();
            const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

            start_dateEl.value = formatDate(firstDayOfMonth);
            end_dateEl.value = formatDate(today);

            // Fetch revenue and costs concurrently and process them once both are available
            Promise.all([
                setRevenue(formatDate(firstDayOfMonth), formatDate(today)),
                getCostData()
            ]).then(([revenueData, costData]) => {
                const totalRevenue = revenueData[0];
                const totalCost = costData.reduce((acc, item) => acc + parseFloat(item.value), 0);

                profit = totalRevenue - totalCost;

                revenueEl.textContent = formatCurrency(totalRevenue);
                revenueEl.classList.add('text-primary')
                costEl.textContent = formatCurrency(totalCost);
                costEl.classList.add('text-danger')
                profitEl.textContent = formatCurrency(profit);
                profitEl.classList.add(profit >= 0 ? 'text-success' : 'text-danger')

                removePlaceholders();
            }).catch(error => {
                console.error("Error in fetching data:", error);
            });
        }

        function setRevenue(startDate, endDate) {
            return fetchData(`${url}?action=get&table=Relatório&start_date=${startDate}&end_date=${endDate}`)
                .then(({ data }) => {
                    return data;
                });
        }

        function getCostData() {
            return fetchData(`${url}?action=read&table=Custo`)
                .then(({ data }) => {
                    renderCostList(data);
                    return data;
                });
        }

        function renderCostList(data) {
            listContainer.innerHTML = '';
            data.forEach((item) => {
                const listItem = createCostListItem(item);
                listContainer.appendChild(listItem);
            });
        }

        function createCostListItem(item) {
            const listItem = document.createElement('li');
            listItem.className = 'list-group-item p-0 mb-3';
            listItem.innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title mb-0">${item.description}</h5>
                            <span class="h5">${formatCurrency(item.value)}</span>
                        </div>
                        <p class="card-text mb-0 d-flex justify-content-between align-items-center">
                            <small class="text-muted">
                                <i class="bi bi-calendar-event me-1"></i>Vencimento em ${new Date(item.dueDate).toLocaleString('pt-BR', { year: 'numeric', month: '2-digit', day: '2-digit' })}
                            </small>
                            <span class="badge bg-primary text-uppercase">${item.costType}</span>
                        </p>
                    </div>
                </div>
            `;
            return listItem;
        }

        function removePlaceholders() {
            ["revenue", "cost", "profit"].forEach(item => {
                const el = document.querySelector(`#${item}`);
                el.classList.remove("placeholder", "col-5", "bg-success", "bg-danger");
            });
        }

        function formatDate(date) {
            return new Intl.DateTimeFormat('pt-BR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(date).split('/').reverse().join('-');
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        }

        async function fetchData(url) {
            try {
                const response = await fetch(url);
                return await response.json();
            } catch (error) {
                console.error('Error fetching data:', error);
                throw error; // Re-throw the error to ensure the Promise chain handles it
            }
        }

        function listPlaceholder() {
            Array.from({ length: 8 }, (item) => {
                const listItem = document.createElement('li');
                listItem.className = 'list-group-item p-0 mb-3';
                listItem.innerHTML = `
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="placeholder col-6 h4"></span>
                                <span class="placeholder col-3 h4"></span>
                            </div>
                            <p class="card-text mb-0 d-flex justify-content-between align-items-center">
                                <span class="placeholder col-5"></span>
                                <span class="bg-primary placeholder col-2"></span>
                            </p>
                        </div>
                    </div>
                    `;
            listContainer.appendChild(listItem);
        })
        }

    </script>
</body>

</html>
