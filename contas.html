<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container mt-5">
        <nav class="navbar">
            <div class="container-fluid">
                <a class="navbar-brand text-uppercase" href="#">
                    PJ Variedades - Contas a pagar
                </a>
                <form class="row g-3">
                    <div class="col-auto">
                        <label for="startDate" class="visually-hidden">Start Date</label>
                        <input type="date" class="form-control" id="startDate">
                    </div>
                    <div class="col-auto">
                        <label for="endDate" class="visually-hidden">End Date</label>
                        <input type="date" class="form-control" id="endDate">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
                    </div>
                </form>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                    data-bs-target="#newTransaction">Nova transação</button>
            </div>
        </nav>

        <div class="row mt-3">
            <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Entradas
                            <i class="bi bi-arrow-down-circle-fill text-success"></i>
                        </h5>
                        <span class="card-text text-primary fw-semibold">R$ 00,00</span>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Saída
                            <i class="bi bi-arrow-up-circle-fill text-danger"></i>
                        </h5>
                        <span class="card-text text-danger fw-semibold"><i class="bi bi-dash me-1"></i>R$ 00,0</span>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title text-end">Total
                            <i class="bi bi-currency-dollar"></i>
                        </h5>
                        <div class="text-end">
                            <span class="card-text text-success fw-bold" id="total">R$ 00,0</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div>
            <ul class="list-group list-group mt-3">
                <table class="table table-hover mt-3">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Item</th>
                            <th scope="col">Valor</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Pagamento</th>
                            <th scope="col">Vencimento</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th scope="row">1</th>
                            <td class="fw-semibold">Conta de água</td>
                            <td>R$ 780,00</td>
                            <td>
                                <span class="badge fw-semibold bg-info text-bg-light">Boleto</span>
                            </td>
                            <td>13/04/2022</td>
                            <td class="text-danger fw-semibold">13/04/2022</td>
                        </tr>
                    </tbody>
                </table>
            </ul>
        </div>

        <div class="modal" id="newTransaction" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Nova transação</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="transactionForm">
                            <div class="mb-3">
                                <label for="inputDescription" class="form-label">Descrição do pagamento</label>
                                <input type="search" class="form-control" id="inputDescription" name="description"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="inputPrice" class="form-label">Valor à pagar</label>
                                <input type="number" inputmode="numeric" class="form-control" id="inputPrice"
                                    name="price" placeholder="R$" required>
                            </div>
                            <div class="mb-3">
                                <label for="dueDate" class="mb-2">Data do vencimento</label>
                                <input type="date" class="form-control" id="dueDate" name="dueDate" required>
                            </div>
                            <div class="mb-3">
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#">Regular link</a></li>
                                    <li><a class="dropdown-item active" href="#" aria-current="true">Active link</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#">Another link</a></li>
                                </ul>
                            </div>

                            <!-- <div class="btn-group w-100" role="group" aria-label="Basic radio toggle button group">
                                <input type="radio" class="btn-check" name="transactionType" id="btnIn" value="entrada"
                                    autocomplete="off" checked>
                                <label class="btn btn-outline-success" for="btnIn">Entrada</label>

                                <input type="radio" class="btn-check" name="transactionType" id="btnOut" value="saida"
                                    autocomplete="off">
                                <label class="btn btn-outline-danger" for="btnOut">Saída</label>
                            </div> -->
                            <div class="mt-3">
                                <button type="submit" class="btn btn-primary w-100 fw-semibold mt-3">Cadastrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>

    <script>
        const today = new Date();
        const startDate = document.querySelector("#startDate");
        const endDate = document.querySelector("#endDate");
        const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        startDate.value = formatDate(firstDayOfMonth);
        endDate.value = formatDate(today);

        document.addEventListener('DOMContentLoaded', () => {
            setTotal(startDate.value, endDate.value);
        })

        document.querySelector("form").addEventListener("submit", function (event) {
            event.preventDefault();
            setTotal(startDate.value, endDate.value);
        });

            return new Intl.DateTimeFormat('pt-BR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(date).split('/').reverse().join('-');
        }

</body>

</html>
