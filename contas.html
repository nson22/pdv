<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>
    <div class="container-fluid">
        <nav class="navbar bg-body-tertiary mb-3">
            <span class="navbar-brand h1 text-uppercase">PJ | Contas a pagar</span>

            <button class="btn btn-sm btn-outline-secondary" type="submit">
                <i class="bi bi-plus-lg"></i>
            </button>
    
            <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasWithBothOptions" aria-controls="offcanvasWithBothOptions"><i
                    class="bi bi-filter"></i></button>
    
            <div class="offcanvas offcanvas-end" data-bs-scroll="true" tabindex="-1" id="offcanvasWithBothOptions"
                aria-labelledby="offcanvasWithBothOptionsLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasWithBothOptionsLabel"><i class="bi bi-filter me-1"></i>Filtrar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <form class="row g-3">
                        <div class="col-12">
                            <label for="startDate" class="visually-hidden">Início</label>
                            <input type="date" class="form-control" id="startDate">
                        </div>
                        <div class="col-12">
                            <label for="endDate" class="visually-hidden">Fim</label>
                            <input type="date" class="form-control" id="endDate">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i></button>
                        </div>
                    </form>
                </div>
            </div>
        </nav>
    
        <div class="row">
            <div class="col-lg-6 col-md-6 col-12 px-4">
                <div class="row">
                    <div class="card mb-2">
                        <div class="card-body placeholder-glow">
                            <div class="row">
                                <div class="col-6">
                                    <h5 class="card-title">Receita</h5>
                                </div>
                                <div class="col-6 text-end">
                                    <span class="card-text fw-bold placeholder col-12" id="revenue">R$
                                        00,0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="card mb-2">
                        <div class="card-body placeholder-glow">
                            <div class="row">
                                <div class="col-6">
                                    <h5 class="card-title">Custo</h5>
                                </div>
                                <div class="col-6 text-end">
                                    <span class="card-text fw-bold placeholder col-12" id="cost">R$
                                        00,00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="card">
                        <div class="card-body placeholder-glow">
                            <div class="row">
                                <div class="col-6">
                                    <h5 class="card-title">Saldo</h5>
                                </div>
                                <div class="col-6 text-end">
                                    <span class="card-text fw-bold placeholder col-12" id="profit">R$ 00,00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6 col-md-6 col-12">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item pb-0 pt-0 mb-2">
                            <div class="row">
                                <div class="col-12">
                                    <div class="card">
                                        <div class="card-body">
                                            <h5 class="card-title placeholder-glow">
                                                <div class="row">
                                                    <div class="col-6">
                                                        <span class="placeholder col-12"></span>
                                                    </div>
                                                    <div class="col-6 text-end">
                                                        <span class="bg-info placeholder col-8"></span>
                                                    </div>
                                                </div>
                                            </h5>
                                            <p class="card-text placeholder-glow">
                                            <div class="row">
                                                <div class="col-8">
                                                    <span class="placeholder col-10"></span>
                                                </div>
                                                <div class="col-4 text-end">
                                                    <span class="placeholder col-12"></span>
                                                </div>
                                            </div>
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </li>
                        <li class="list-group-item pb-0 pt-0 mb-2 mt-2">
                            <div class="row">
                                <div class="col-12">
                                    <div class="card">
                                        <div class="card-body">
                                            <h5 class="card-title placeholder-glow">
                                                <div class="row">
                                                    <div class="col-6">
                                                        <span class="placeholder col-12"></span>
                                                    </div>
                                                    <div class="col-6 text-end">
                                                        <span class="bg-info placeholder col-8"></span>
                                                    </div>
                                                </div>
                                            </h5>
                                            <p class="card-text placeholder-glow">
                                            <div class="row">
                                                <div class="col-8">
                                                    <span class="placeholder col-10"></span>
                                                </div>
                                                <div class="col-4 text-end">
                                                    <span class="placeholder col-12"></span>
                                                </div>
                                            </div>
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </li>
                    </ul>
            </div>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbzzMdkpJoimgcsbTa4kgFtRwpPGVIXZtZAVqyk3IrWBwR5PD-FB18vL3dPGCORM2lBY/exec';
        const revenueEl = document.querySelector('#revenue');
        const costEl = document.querySelector('#cost');
        const profitEl = document.querySelector('#profit');
        const start_dateEl = document.querySelector('#startDate')
        const end_dateEl = document.querySelector('#endDate');

        var profit = 0

        document.addEventListener('DOMContentLoaded', initializePage);

        function initializePage() {
            const today = new Date();
            const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

            start_dateEl.value = formatDate(firstDayOfMonth);
            end_dateEl.value = formatDate(today);

            // Fetch revenue and costs concurrently and process them once both are available
            Promise.all([
                setRevenue(formatDate(firstDayOfMonth), formatDate(today)),
                getCostData()
            ]).then(([revenueData, costData]) => {
                const totalRevenue = revenueData[0];
                const totalCost = costData.reduce((acc, item) => acc + parseFloat(item.value), 0);

                profit = totalRevenue - totalCost;

                revenueEl.textContent = formatCurrency(totalRevenue);
                costEl.textContent = formatCurrency(totalCost);
                profitEl.textContent = formatCurrency(profit);

                removePlaceholders();
            }).catch(error => {
                console.error("Error in fetching data:", error);
            });
        }

        function setRevenue(startDate, endDate) {
            return fetchData(`${url}?action=get&table=Relatório&start_date=${startDate}&end_date=${endDate}`)
                .then(({ data }) => {
                    return data;
                });
        }

        function getCostData() {
            return fetchData(`${url}?action=read&table=Custo`)
                .then(({ data }) => {
                    renderCostList(data);
                    return data;
                });
        }

        function renderCostList(data) {
            const listContainer = document.querySelector('.list-group');
            listContainer.innerHTML = '';
            data.forEach((item) => {
                const listItem = createCostListItem(item);
                listContainer.appendChild(listItem);
            });
        }

        function createCostListItem(item) {
            debugger
            const listItem = document.createElement('li');
            listItem.className = 'list-group-item pt-0 pb-0';
            listItem.innerHTML = `
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">
                                    <div class="row">
                                        <div class="col-6">
                                            <span>${item.description}</span>
                                        </div>
                                        <div class="col-6 text-end">
                                            <span class="badge fw-semibold bg-info text-bg-light text-uppercase">${item.costType}</span>
                                        </div>
                                    </div>
                                </h5>
                                <p class="card-text">
                                <div class="row">
                                    <div class="col-8">
                                        <span class="fw-semibold">Vencimento em ${formatDate(new Date(item.dueDate))}</span>
                                    </div>
                                    <div class="col-4 text-end fw-bold">
                                        ${formatCurrency(item.value)}
                                    </div>
                                </div>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            return listItem;
        }

        function removePlaceholders() {
            ["revenue", "cost", "profit"].forEach(item => {
                const el = document.querySelector(`#${item}`);
                el.classList.remove("placeholder", "col-5", "bg-success", "bg-danger");
            });
        }

        function formatDate(date) {
            return new Intl.DateTimeFormat('pt-BR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(date).split('/').reverse().join('-');
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        }

        async function fetchData(url) {
            try {
                const response = await fetch(url);
                return await response.json();
            } catch (error) {
                console.error('Error fetching data:', error);
                throw error; // Re-throw the error to ensure the Promise chain handles it
            }
        }

    </script>
</body>

</html>
