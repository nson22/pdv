<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>
    <div class="container-fluid">
        <nav class="navbar bg-body-tertiary p-3">
            <span class="navbar-brand mb-0 h1 text-uppercase">PJ | Contas a pagar</span>

            <button class="btn btn-sm btn-outline-secondary" type="submit">
                <i class="bi bi-plus-lg"></i>
            </button>

            <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasWithBothOptions" aria-controls="offcanvasWithBothOptions"><i
                    class="bi bi-filter"></i></button>

            <div class="offcanvas offcanvas-end" data-bs-scroll="true" tabindex="-1" id="offcanvasWithBothOptions"
                aria-labelledby="offcanvasWithBothOptionsLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasWithBothOptionsLabel"><i
                            class="bi bi-filter me-1"></i>Filtrar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <form class="row g-3">
                        <div class="col-12">
                            <label for="startDate" class="visually-hidden">Início</label>
                            <input type="date" class="form-control" id="startDate">
                        </div>
                        <div class="col-12">
                            <label for="endDate" class="visually-hidden">Fim</label>
                            <input type="date" class="form-control" id="endDate">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i></button>
                        </div>
                    </form>
                </div>
            </div>

        </nav>


        <div class="row g-1">
            <div class="col-12">
                <div class="card">
                    <div class="card-body placeholder-glow">
                        <div class="row">
                            <div class="col-6">
                                <h5 class="card-title">Receita</h5>
                            </div>
                            <div class="col-6 text-end">
                                <span class="card-text text-primary fw-bold placeholder col-12" id="revenue">R$
                                    00,0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="card">
                    <div class="card-body placeholder-glow">
                        <div class="row">
                            <div class="col-6">
                                <h5 class="card-title">Custo</h5>
                            </div>
                            <div class="col-6 text-end">
                                <span class="card-text text-danger fw-bold placeholder col-12 bg-danger" id="cost">R$
                                    00,00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="card">
                    <div class="card-body placeholder-glow">
                        <div class="row">
                            <div class="col-6">
                                <h5 class="card-title">Saldo</h5>
                            </div>
                            <div class="col-6 text-end">
                                <span class="card-text text-success fw-bold placeholder col-12 bg-success"
                                    id="profit">R$ 00,00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <h5 class="mt-3 ps-1">Lista de custos</h5>
        <ul class="list-group list-group-flush">


            <li class="list-group-item p-0">
                <div class="row mt-2">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title placeholder-glow">
                                    <div class="row">
                                        <div class="col-6">
                                            <span class="placeholder col-12"></span>
                                        </div>
                                        <div class="col-6 text-end">
                                            <span class="btn btn-sm btn-info disabled placeholder col-8"></span>
                                        </div>
                                    </div>
                                </h5>
                                <p class="card-text placeholder-glow">
                                <div class="row">
                                    <div class="col-8">
                                        <span class="text-bg-danger placeholder col-10"></span>
                                    </div>
                                    <div class="col-4 text-end">
                                        <span class="text-bg-danger placeholder col-12"></span>
                                    </div>
                                </div>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </li>
        </ul>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbzzMdkpJoimgcsbTa4kgFtRwpPGVIXZtZAVqyk3IrWBwR5PD-FB18vL3dPGCORM2lBY/exec';
        
        const formatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
        const dateFormatter = new Intl.DateTimeFormat('pt-BR', { year: 'numeric', month: '2-digit', day: '2-digit' });

        document.addEventListener('DOMContentLoaded', initializePage);

        function initializePage() {
            const today = new Date();
            const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

            document.querySelector("#startDate").value = formatDateForInput(firstDayOfMonth);
            document.querySelector("#endDate").value = formatDateForInput(today);

            setRevenue(formatDateForInput(firstDayOfMonth), formatDateForInput(today));
            getCostData();
        }

        function setRevenue(startDate, endDate) {
            fetchData(`${url}?action=get&table=Relatório&start_date=${startDate}&end_date=${endDate}`)
                .then(({ data }) => {
                    document.getElementById('revenue').textContent = formatter.format(data);
                    removePlaceholders();
                });
        }

        function getCostData() {
            fetchData(`${url}?action=read&table=Custo`)
                .then(({ data }) => {
                    const totalCost = data.reduce((acc, item) => acc + parseFloat(item.value), 0);
                    document.getElementById('cost').textContent = formatter.format(totalCost);

                    const revenueValue = parseFloat(document.getElementById('revenue').textContent.replace(/[^\d,-]/g, '').replace(',', '.'));
                    const profit = revenueValue - totalCost;
                    document.getElementById('profit').textContent = formatter.format(profit);

                    renderCostList(data);
                });
        }

        function renderCostList(data) {
            const listContainer = document.querySelector('.list-group');
            listContainer.innerHTML = '';
            data.forEach((item) => {
                const listItem = createCostListItem(item);
                listContainer.appendChild(listItem);
            });
        }

        function createCostListItem(item) {
            const listItem = document.createElement('li');
            listItem.className = 'list-group-item p-0 pb-2';
            listItem.innerHTML = `
            <div class="row mt-2">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">
                                <div class="row">
                                    <div class="col-6">
                                        <span>${item.description}</span>
                                    </div>
                                    <div class="col-6 text-end">
                                        <span class="badge fw-semibold bg-info text-bg-light text-uppercase">${item.costType}</span>
                                    </div>
                                </div>
                            </h5>
                            <p class="card-text">
                            <div class="row">
                                <div class="col-8">
                                    <span class="fw-semibold text-danger">Vencimento em ${formatDate(new Date(item.dueDate))}</span>
                                </div>
                                <div class="col-4 text-end fw-bold text-danger">
                                    ${formatCurrency(item.value)}
                                </div>
                            </div>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        `;
            return listItem;
        }

        function removePlaceholders() {
            ["revenue", "cost", "profit"].forEach(item => {
                const el = document.querySelector(`#${item}`);
                el.classList.remove("placeholder", "col-5", "bg-success", "bg-danger");
            });
        }

        function formatDate(date) {
            return dateFormatter.format(date).split('/').reverse().join('-');
        }

        function formatDateForInput(date) {
            return dateFormatter.format(date).split('/').reverse().join('-');
        }

        function formatCurrency(value) {
            return formatter.format(value);
        }

        async function fetchData(url) {
            try {
                const response = await fetch(url);
                return await response.json();
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }
    </script>
</body>

</html>
