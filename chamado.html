<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Montserrat", sans-serif;
    }
  </style>
</head>

<body>
  <div class="container">
    <nav class="navbar bg-body-light fixed-top">
      <div class="container-fluid">
        <div class="d-flex justify-content-center w-100">
          <img src="https://cache2net4.com/Repositorio/13384/Logo/logo%20site2.png" alt="Logo" style="width: 12rem;"
            class="navbar-brand">
        </div>
      </div>
    </nav>

    <h3 class="text-uppercase text-center mt-5 pt-5">Chamado de Manutenção</h3>
    <form id="maintenanceForm" class="needs-validation" novalidate>
      <div class="row g-3">
        <div class="col-12">
          <label for="solicitantes" class="form-label text-uppercase">Solicitante</label>
          <select class="form-select" id="solicitantes" required>
            <option value="">Selecionar</option>
          </select>
          <div class="invalid-feedback">Por favor, selecione um solicitante.</div>
        </div>
        <div class="col-12">
          <label for="departamentos" class="form-label text-uppercase">Departamento</label>
          <select class="form-select" id="departamentos" required>
            <option value="">Selecionar</option>
          </select>
          <div class="invalid-feedback">Por favor, selecione um departamento.</div>
        </div>
        <div class="col-12">
          <label for="equipamentos" class="form-label text-uppercase">Equipamento</label>
          <select class="form-select" id="equipamentos" required>
            <option value="">Selecionar</option>
          </select>
          <div class="invalid-feedback">Por favor, selecione um equipamento.</div>
        </div>
        <div class="col-12">
          <label for="descricao" class="form-label text-uppercase">Descrição</label>
          <textarea class="form-control" rows="3" id="descricao" style="resize: none" required></textarea>
          <div class="invalid-feedback">Por favor, forneça uma descrição.</div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary btn-lg w-100 text-uppercase fw-semibold mt-3">
            Abrir Chamado
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- Loading Modal -->
  <div class="modal fade" id="loadingModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
          </div>
          <p class="mt-3" id="modalMessage"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="notificationToast" class="toast bg-success" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto">Mensagem</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body" id="toastMessage"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // UI Components
    const UI = {
      modal: {
        element: new bootstrap.Modal(document.getElementById('loadingModal')),
        message: document.getElementById('modalMessage')
      },
      toast: {
        element: new bootstrap.Toast(document.getElementById('notificationToast')),
        container: document.getElementById('notificationToast'),
        message: document.getElementById('toastMessage')
      },
      form: document.getElementById('maintenanceForm')
    };

    // Configuration
    const CONFIG = {
      tables: ['solicitantes', 'departamentos', 'equipamentos']
    };

    // Utility Functions
    const Utils = {
      showLoading: (message) => {
        UI.modal.message.textContent = message;
        UI.modal.element.show();
      },
      hideLoading: () => {
        UI.modal.element.hide();
      },
      showNotification: (message, type) => {
        UI.toast.container.className = 'toast';
        UI.toast.container.classList.add(`bg-${type}`, 'text-white');
        UI.toast.message.textContent = message;
        UI.toast.element.show();

      }
    };

    // Form Handlers
    const FormHandlers = {
      populateSelect: (elementId, data) => {
        const select = document.getElementById(elementId);
        select.innerHTML = '<option value="">Selecionar</option>';

        data.forEach(item => {
          const option = document.createElement('option');
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      },

      getFormData: () => {
        return {
          solicitante: document.getElementById('solicitantes').value,
          departamento: document.getElementById('departamentos').value,
          equipamento: document.getElementById('equipamentos').value,
          descricao: document.getElementById('descricao').value
        };
      },

      resetForm: () => {
        UI.form.reset();
        UI.form.classList.remove('was-validated');
      }
    };

    // API Handlers
    const API = {
      loadData: () => {
        Utils.showLoading('Carregando dados, aguarde...');

        CONFIG.tables.forEach(table => {
          google.script.run
            .withSuccessHandler((response) => {
              FormHandlers.populateSelect(table, response);
              Utils.hideLoading();
            })
            .withFailureHandler((error) => {
              console.error(`Erro ao carregar ${table}:`, error);
              Utils.showNotification(`Erro ao carregar ${table}`, 'danger');
              Utils.hideLoading();
            })
            .read(table);
        });
      },

      submitForm: (formData) => {
        Utils.showLoading('Abrindo chamado, aguarde...');

        google.script.run
          .withSuccessHandler(() => {
            Utils.hideLoading();
            Utils.showNotification('Chamado aberto com sucesso!', 'success');
            FormHandlers.resetForm();
          })
          .withFailureHandler((error) => {
            console.error('Erro ao abrir chamado:', error);
            Utils.hideLoading();
            Utils.showNotification('Falha ao abrir o chamado!', 'danger');
          })
          .post(formData);
      }
    };

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      API.loadData();
    });

    UI.form.addEventListener('submit', (event) => {
      event.preventDefault();

      if (!UI.form.checkValidity()) {
        event.stopPropagation();
        UI.form.classList.add('was-validated');
        return;
      }

      const formData = FormHandlers.getFormData();
      API.submitForm(formData);
    });
  </script>
</body>

</html>
