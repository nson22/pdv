<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Montserrat", sans-serif;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="d-flex justify-content-center w-100">
      <img src="https://cache2net4.com/Repositorio/13384/Logo/logo%20site2.png" alt="Logo" style="width: 12rem;"
        class="navbar-brand">
    </div>
    <h3 class="text-uppercase text-center fw-bold mt-3">Chamado de Manutenção</h3>
    <form id="maintenanceForm" class="needs-validation mt-3" novalidate>
      <div class="row g-3">
        <div class="col-12 mb-3">
          <label for="solicitantes" class="form-label text-uppercase fw-semibold">Solicitante</label>
          <select class="form-select" id="solicitantes" required>
            <option value="">Selecionar</option>
          </select>
          <div class="invalid-feedback">Por favor, selecione um solicitante.</div>
        </div>
        <div class="col-12 mb-3">
          <label for="departamentos" class="form-label text-uppercase fw-semibold">Departamento</label>
          <select class="form-select" id="departamentos" required>
            <option value="">Selecionar</option>
          </select>
          <div class="invalid-feedback">Por favor, selecione um departamento.</div>
        </div>
        <div class="col-12 mb-3">
          <label for="equipamentos" class="form-label text-uppercase fw-semibold">Equipamento</label>
          <select class="form-select" id="equipamentos" required>
            <option value="">Selecionar</option>
          </select>
          <div class="invalid-feedback">Por favor, selecione um equipamento.</div>
        </div>
        <div class="col-12 mb-1">
          <label for="descricao" class="form-label text-uppercase fw-semibold">Descrição</label>
          <textarea class="form-control" rows="3" id="descricao" style="resize: none" required></textarea>
          <div class="invalid-feedback">Por favor, forneça uma descrição.</div>
        </div>
        <div class="col-12 mb-3">
          <button type="submit" class="btn btn-primary btn-lg w-100 text-uppercase fw-semibold mt-3">
            Abrir Chamado
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- Loading Modal -->
  <div class="modal fade" id="loadingModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
          </div>
          <p class="mt-3" id="loadingMessage"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Message Modal -->
  <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="messageModalLabel">Mensagem</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="messageModalBody"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const tables = ['solicitantes', 'departamentos', 'equipamentos']

    /**
     * Evento que é disparado quando o DOM é completamente carregado.
     * Verifica se a aplicação está rodando em localhost e carrega os dados apropriadamente.
     * @listens DOMContentLoaded
     * Se não estiver em localhost, faz uma chamada para o Google Apps Script.
     * @function google.script.run
     * 
     */
    document.addEventListener('DOMContentLoaded', function () {
      showLoadingModal('Carregando dados, aguarde...');

      if (isLocalhost()) {
        setTimeout(() => {
          mockData();
          hideLoadingModal();
        }, 3000);
      } else {
        const promises = tables.map(table =>
          new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(response => {
                populateSelect(table, response);
                resolve();
              })
              .withFailureHandler(error => {
                console.error(`Erro ao carregar ${table}:`, error);
                reject(error);
              })
              .read(table);
          })
        );

        Promise.all(promises)
          .then(() => {
            hideLoadingModal();
          })
          .catch(error => {
            console.error('Erro ao carregar dados:', error);
            hideLoadingModal();
            showMessageModal('Erro ao carregar dados. Por favor, tente novamente.', 'Erro', false);
          });
      }
    });

    /**
     * Adiciona um event listener para o evento de submissão do formulário de manutenção.
     * Valida o formulário, processa os dados e exibe uma notificação.
     * 
     * @listens submit
     * @param {Event} event - O evento de submissão do formulário.
     */
    document.getElementById("maintenanceForm").addEventListener("submit", function (event) {
      event.preventDefault();
      if (this.checkValidity()) {
        const formData = {
          solicitante: document.getElementById('solicitantes').value,
          departamento: document.getElementById('departamentos').value,
          equipamento: document.getElementById('equipamentos').value,
          descricao: document.getElementById('descricao').value
        };

        console.log(formData);


        // Show loading modal
        showLoadingModal('Enviando chamado, aguarde...');

        if (isLocalhost()) {
          // Simulate API call for localhost
          setTimeout(() => {
            hideLoadingModal();
            showMessageModal('Chamado aberto com sucesso!', 'Sucesso', true);
            this.reset();
            this.classList.remove("was-validated");
          }, 2000);
        } else {
          // Real API call for production
          google.script.run
            .withSuccessHandler(response => {
              hideLoadingModal();
              showMessageModal('Chamado aberto com sucesso!', 'Sucesso', true);
              this.reset();
              this.classList.remove("was-validated");
            })
            .withFailureHandler(error => {
              hideLoadingModal();
              showMessageModal('Erro ao abrir o chamado. Por favor, tente novamente.', 'Erro', false);
              console.error('Erro ao enviar chamado:', error);
            })
            .post(formData);
        }
      } else {
        this.classList.add("was-validated");
      }
    });
    /**
     * Preenche um elemento select com opções baseadas nos dados fornecidos.
     * 
     * @param {string} id - O ID do elemento select a ser preenchido.
     * @param {Array<string>} data - Um array de strings contendo os valores para as opções.
     * @returns {void}
     * 
     * @description
     * Esta função realiza as seguintes operações:
     * 1. Seleciona o elemento select com base no ID fornecido.
     * 2. Limpa o conteúdo existente do select e adiciona uma opção padrão "Selecionar".
     * 3. Itera sobre o array de dados, criando e adicionando uma nova opção para cada item.
     * 4. Remove o atributo "disabled" do select, tornando-o interativo.
     */
    function populateSelect(id, data) {
      const select = document.getElementById(id);
      select.innerHTML = '<option value="">Selecionar</option>';
      data.forEach(item => {
        const option = document.createElement("option");
        option.value = item;
        option.textContent = item;
        select.appendChild(option);
      });
      select.removeAttribute("disabled");
    }

    /**
     * Exibe o modal de carregamento com uma mensagem personalizada.
     * 
     * @param {string} message - A mensagem a ser exibida no modal de carregamento.
     */
    function showLoadingModal(message) {
      const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'));
      document.getElementById('loadingMessage').textContent = message;
      loadingModal.show();
    }

    /**
     * Oculta o modal de carregamento.
     */
    function hideLoadingModal() {
      const loadingModalElement = document.getElementById('loadingModal');
      const loadingModal = bootstrap.Modal.getInstance(loadingModalElement);
      if (loadingModal) {
        loadingModal.hide();
      }
    }

    /**
     * Exibe o modal de mensagem com uma mensagem personalizada e estilo apropriado,
     * e o fecha automaticamente após um período especificado.
     * 
     * @param {string} message - A mensagem a ser exibida no modal.
     * @param {string} [title='Mensagem'] - O título do modal (opcional).
     * @param {boolean} [isSuccess=true] - Indica se a mensagem é de sucesso (true) ou erro (false).
     * @param {number} [autoCloseDelay=3000] - Tempo em milissegundos antes do modal fechar automaticamente.
     */
    function showMessageModal(message, title = 'Mensagem', isSuccess = true, autoCloseDelay = 3000) {
      const messageModal = new bootstrap.Modal(document.getElementById('messageModal'));
      const modalElement = document.getElementById('messageModal');
      const headerElement = modalElement.querySelector('.modal-header');
      const titleElement = document.getElementById('messageModalLabel');
      const bodyElement = document.getElementById('messageModalBody');
      const closeButton = modalElement.querySelector('.modal-footer .btn-primary');

      // Set the title and message
      titleElement.textContent = title;
      bodyElement.textContent = message;

      // Set the appropriate background color and text color for the header
      if (isSuccess) {
        headerElement.classList.remove('bg-danger', 'text-white');
        headerElement.classList.add('bg-success', 'text-white');
      } else {
        headerElement.classList.remove('bg-success', 'text-white');
        headerElement.classList.add('bg-danger', 'text-white');
      }

      // Update close button text with countdown
      const updateCloseButtonText = (secondsLeft) => {
        closeButton.textContent = `Fechar (${secondsLeft}s)`;
      };

      // Start countdown
      let secondsLeft = Math.ceil(autoCloseDelay / 1000);
      updateCloseButtonText(secondsLeft);

      const countdownInterval = setInterval(() => {
        secondsLeft--;
        updateCloseButtonText(secondsLeft);
        if (secondsLeft <= 0) {
          clearInterval(countdownInterval);
        }
      }, 1000);

      messageModal.show();

      // Automatically close the modal after the specified delay
      setTimeout(() => {
        messageModal.hide();
        clearInterval(countdownInterval);
      }, autoCloseDelay);

      // Reset the button text when the modal is hidden
      modalElement.addEventListener('hidden.bs.modal', () => {
        closeButton.textContent = 'Fechar';
        clearInterval(countdownInterval);
      });
    }

    /**
     * Preenche os campos do formulário com dados simulados para fins de teste.
     * 
     * @function
     * @name mockData
     * 
     * @description
     * Esta função cria arrays de dados simulados para solicitantes, departamentos e equipamentos,
     * e os utiliza para preencher os respectivos campos de seleção no formulário. Também habilita
     * o campo de descrição e o botão de submissão.
     * 
     * @returns {void}
     * 
     * @example
     * mockData();
     * 
     * @notes
     * - Cria arrays de dados simulados para solicitantes, departamentos e equipamentos.
     * - Utiliza a função populateSelect para preencher os campos de seleção.
     * - Remove o atributo "disabled" do campo de descrição.
     * - Remove a classe "disabled" do botão de submissão.
     */
    function mockData() {
      const mockSolicitantes = ["João Silva", "Maria Santos", "Carlos Oliveira"];
      const mockDepartamentos = ["TI", "RH", "Financeiro", "Marketing"];
      const mockEquipamentos = ["Computador", "Impressora", "Telefone", "Projetor"];

      populateSelect("solicitantes", mockSolicitantes);
      populateSelect("departamentos", mockDepartamentos);
      populateSelect("equipamentos", mockEquipamentos);

      document.querySelector("#descricao").removeAttribute("disabled");
      document.querySelector("button[type='submit']").classList.remove("disabled");
    }

    /**
     * Verifica se a aplicação está sendo executada em um ambiente local.
     * 
     * @function
     * @name isLocalhost
     * 
     * @description
     * Esta função checa se o hostname atual é "localhost" ou "127.0.0.1",
     * indicando que a aplicação está sendo executada em um ambiente de desenvolvimento local.
     * 
     * @returns {boolean} Retorna true se a aplicação estiver rodando localmente, false caso contrário.
     * 
     * @example
     * if (isLocalhost()) {
     *   console.log("Executando em ambiente local");
     * } else {
     *   console.log("Executando em ambiente de produção");
     * }
     */
    function isLocalhost() {
      return window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    }

  </script>
</body>

</html>
