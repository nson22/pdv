<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Montserrat", sans-serif;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="d-flex justify-content-center w-100">
      <img src="https://cache2net4.com/Repositorio/13384/Logo/logo%20site2.png" alt="Logo" style="width: 12rem;"
        class="navbar-brand">
    </div>

    <h3 class="text-uppercase text-center fw-bold mt-3">Chamado de Manutenção</h3>
    <form id="maintenanceForm" class="needs-validation mt-3" novalidate>
      <div class="row g-3">
        <div class="col-12 mb-3">
          <label for="solicitantes" class="form-label text-uppercase fw-semibold">Solicitante</label>
          <select class="form-select" id="solicitantes" required>
            <option value="">Selecionar</option>
          </select>
          <div class="invalid-feedback">Por favor, selecione um solicitante.</div>
        </div>
        <div class="col-12 mb-3">
          <label for="departamentos" class="form-label text-uppercase fw-semibold">Departamento</label>
          <select class="form-select" id="departamentos" required>
            <option value="">Selecionar</option>
          </select>
          <div class="invalid-feedback">Por favor, selecione um departamento.</div>
        </div>
        <div class="col-12 mb-3">
          <label for="equipamentos" class="form-label text-uppercase fw-semibold">Equipamento</label>
          <select class="form-select" id="equipamentos" required>
            <option value="">Selecionar</option>
          </select>
          <div class="invalid-feedback">Por favor, selecione um equipamento.</div>
        </div>
        <div class="col-12 mb-1">
          <label for="descricao" class="form-label text-uppercase fw-semibold">Descrição</label>
          <textarea class="form-control" rows="3" id="descricao" style="resize: none" required></textarea>
          <div class="invalid-feedback">Por favor, forneça uma descrição.</div>
        </div>
        <div class="col-12 mb-3">
          <button type="submit" class="btn btn-primary btn-lg w-100 text-uppercase fw-semibold mt-3">
            Abrir Chamado
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- Loading Modal -->
  <div class="modal fade" id="loadingModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
          </div>
          <p class="mt-3" id="modalMessage"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="notificationToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto">Mensagem</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body bg-white" id="toastMessage"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const url = 'https://script.google.com/macros/s/AKfycbzOfaFuTy7G9AD9Vr8HpsGuJxAEFbViLinio9ZDXUbdfWgY1h0HCSGC0swGjzWhrzKjPg/exec'
    const tables = ['solicitantes', 'departamentos', 'equipamentos']
    const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'));
    const modalMessage = document.getElementById('modalMessage');

    document.addEventListener('DOMContentLoaded', function () {
      modalMessage.textContent = 'Carregando dados...';
      loadingModal.show();

      tables.forEach((table) => {
        fetch(`${url}?action=read&table=${table}`)
          .then(response => response.json())
          .then(({ data }) => {
            populateSelect(table, data);
          })
          .catch(error => {
            console.error(`Error fetching ${table}:`, error);
            showNotification(`Erro ao carregar ${table}. Por favor, tente novamente.`, 'danger');
          }).finally(() => {
            loadingModal.hide();
          })
      });
    });

    /**
     * Adiciona um event listener para o evento de submissão do formulário de manutenção.
     * Valida o formulário, processa os dados e exibe uma notificação.
     * 
     * @listens submit
     * @param {Event} event - O evento de submissão do formulário.
     */
    document.getElementById("maintenanceForm").addEventListener("submit", function (event) {
      event.preventDefault();

      if (this.checkValidity()) {
        const formData = {
          id: '',
          month_year: new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/^\d{2}/, '01'),
          created_at: new Date().toLocaleString('pt-BR'),
          owner: document.getElementById('solicitantes').value,
          department: document.getElementById('departamentos').value,
          equipment: document.getElementById('equipamentos').value,
          description: document.getElementById('descricao').value,
          status: 'Aberto',
          defect_code: '',
          defect_description: '',
          in_progress_date: '',
          done_date: '',
          final_remark: ''
        };

        modalMessage.textContent = 'Enviando dados...';
        loadingModal.show();

        fetch(`${url}?action=insert&table=os&data=${JSON.stringify(formData)}`)
          .then(response => response.json())
          .then(data => {
            console.log(data);

            if (data.success) {
              showNotification(`Chamado nº<span class='fw-semibold'>${data.data.id}</span> aberto com sucesso!`, 'success');
              this.reset();
              this.classList.remove("was-validated");
            } else {
              throw new Error('Falha ao abrir o chamado');
            }
          })
          .catch(error => {
            console.error('Error:', error);
            showNotification('Erro ao abrir o chamado. Por favor, tente novamente.', 'danger');
          })
          .finally(() => {
            loadingModal.hide();
          });
      } else {
        this.classList.add("was-validated");
      }
    });

    function showNotification(message, type) {
      const toast = document.getElementById('notificationToast');
      const toastHeader = toast.querySelector('.toast-header');
      const toastMessage = document.getElementById('toastMessage');

      // Remove previous color classes from the header
      toastHeader.classList.remove('bg-success', 'bg-danger', 'text-white');

      // Add new color class to the header
      toastHeader.classList.add(`bg-${type}`, 'text-white');

      // Ensure the toast body is white
      toast.querySelector('.toast-body').classList.add('bg-white');

      // Set the message
      toastMessage.innerHTML = message;

      // Show the toast
      const bsToast = new bootstrap.Toast(toast);
      bsToast.show();
    }

    /**
   * Preenche um elemento select com opções baseadas nos dados fornecidos.
   * 
   * @param {string} id - O ID do elemento select a ser preenchido.
   * @param {Array<Object>} data - Um array de objetos contendo os dados para as opções.
   * @returns {void}
   * 
   * @description
   * Esta função realiza as seguintes operações:
   * 1. Seleciona o elemento select com base no ID fornecido.
   * 2. Limpa o conteúdo existente do select e adiciona uma opção padrão "Selecionar".
   * 3. Verifica se os dados são válidos e não estão vazios.
   * 4. Itera sobre o array de dados, criando e adicionando uma nova opção para cada item.
   * 5. Remove o atributo "disabled" do select, tornando-o interativo.
   * 6. Se houver um erro, exibe uma notificação.
   */
    function populateSelect(id, data) {
      const select = document.getElementById(id);
      select.innerHTML = '<option value="">Selecionar</option>';

      if (Array.isArray(data) && data.length > 0) {
        data.forEach(item => {
          if (item && item.name) {
            const option = document.createElement("option");
            option.value = item.name;
            option.textContent = item.name;
            select.appendChild(option);
          }
        });
        select.removeAttribute("disabled");
      } else {
        console.error(`Invalid or empty data for ${id}`);
        showNotification(`Erro ao carregar dados para ${id}. Por favor, tente novamente.`, 'danger');
      }
    }
  </script>
</body>

</html>
